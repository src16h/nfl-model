<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Board · NFL model</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏈</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --board:#0F1B2D; --panel:#15263E; --panel2:#1B2F4B; --line:#27405F;
  --ink:#EAF0F6; --muted:#93A6BF; --led:#FFB547; --led-dim:#7A5A2A; --turf:#43C47F; --warn:#FF7A6B;
  --cond:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --board:#EEF2F6; --panel:#FFFFFF; --panel2:#F5F7FA; --line:#D3DBE5;
    --ink:#0F1B2D; --muted:#586A82; --led:#A95F00; --led-dim:#E9C995; --turf:#17804A; --warn:#C2412F;
  }
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--board);color:var(--ink);font:16px/1.5 var(--body);-webkit-font-smoothing:antialiased}
.wrap{max-width:1080px;margin:0 auto;padding:20px 16px 64px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:18px}
h1{font:700 44px/1 var(--cond);margin:0;letter-spacing:.5px}
h1 small{display:block;font:500 17px/1.3 var(--body);color:var(--muted);letter-spacing:0;margin-top:6px}
.updated{color:var(--muted);font-size:14px;text-align:right}
nav{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:20px;overflow-x:auto}
nav button{font:600 18px var(--cond);background:none;border:0;color:var(--muted);padding:10px 14px;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
nav button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--led)}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--led);outline-offset:2px}
h2{font:700 26px/1.1 var(--cond);margin:28px 0 10px}
.hint{color:var(--muted);font-size:14px;margin:0 0 14px;max-width:70ch}
.msg{background:var(--panel);border:1px solid var(--line);padding:16px;border-radius:6px}

/* leans strip */
.leans{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}
.lean{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--led);padding:8px 12px;border-radius:4px;font-size:15px}
.lean b{font:700 19px var(--cond)}
.lean span{color:var(--muted)}
.more{font:600 16px var(--cond);background:none;border:1px solid var(--line);color:var(--ink);border-radius:4px;padding:6px 12px;cursor:pointer}

/* the board */
.game{background:var(--panel);border:1px solid var(--line);border-radius:6px;margin-bottom:10px;overflow:hidden}
.grow{display:grid;grid-template-columns:76px 96px 1fr 1fr 1fr;align-items:center}
.grow + .grow{border-top:1px dashed var(--line)}
.tm{font:700 26px var(--cond);padding:10px 0 10px 14px}
.score{font:700 38px/1 var(--cond);color:var(--led);font-variant-numeric:tabular-nums;text-shadow:0 0 18px color-mix(in srgb,var(--led) 35%,transparent)}
.cell{padding:8px 12px;font-size:14px;color:var(--muted)}
.cell strong{display:block;font:600 19px var(--cond);color:var(--ink);font-variant-numeric:tabular-nums}
.cell .flag{color:var(--turf);font-weight:600}
.gfoot{background:var(--panel2);padding:8px 14px;font-size:14px;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px 18px}
.gfoot .qb{color:var(--ink)}
.gfoot .inj{color:var(--warn)}
.state{font:600 15px var(--cond);color:var(--muted)}
.final{color:var(--ink)}
@media (max-width:720px){
  .grow{grid-template-columns:64px 80px 1fr 1fr}
  .grow .cell:nth-child(5){grid-column:1/-1;border-top:1px dotted var(--line);padding-left:14px}
  .score{font-size:32px}
}

/* tables */
.controls{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:12px;align-items:center}
select,input[type=search]{font:500 15px var(--body);background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:8px 10px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.seg button{font:600 15px var(--cond);background:var(--panel);color:var(--muted);border:0;padding:8px 12px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--led);color:#1A1204}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:6px;background:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:15px;font-variant-numeric:tabular-nums}
th{font:600 15px var(--cond);color:var(--muted);text-align:right;padding:10px;border-bottom:1px solid var(--line);white-space:nowrap;cursor:pointer;user-select:none;background:var(--panel2);position:sticky;top:0}
th:first-child,td:first-child{text-align:left}
th.sorted{color:var(--led)}
td{padding:8px 10px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
tr.p{cursor:pointer}
tr.p:hover td{background:var(--panel2)}
tr.detail td{background:var(--panel2);text-align:left;color:var(--muted);font-size:14px;white-space:normal}
.pname{font-weight:600}
.pos{color:var(--muted);font-size:13px;margin-left:6px}
.qtag{color:var(--warn);font-weight:600;margin-left:6px;font-size:13px}
.bar{display:inline-block;height:8px;border-radius:2px;background:var(--led);vertical-align:middle}
.bar.neg{background:var(--warn)}
.neg-t{color:var(--warn)}.pos-t{color:var(--turf)}

/* record */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:12px 14px}
.stat strong{display:block;font:700 30px/1.1 var(--cond);color:var(--led);font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:13px}
.chip.ok::before{content:"● ";color:var(--turf)}
.chip.bad::before{content:"● ";color:var(--warn)}
.why{width:100%;color:var(--muted)}
.why b{color:var(--ink);font-weight:600}
.pairs{display:grid;gap:8px;margin-top:8px}
.pair{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--turf);border-radius:4px;padding:8px 12px;font-size:15px}
.pair span{color:var(--muted)}
td.lean-o{color:var(--turf);font-weight:600}
td.lean-u{color:var(--led);font-weight:600}
td.err{color:var(--muted);font-style:italic}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="title">The Board<small id="sub">Loading the latest model run…</small></h1>
    <div class="updated" id="updated"></div>
  </header>
  <nav role="tablist" aria-label="Sections">
    <button role="tab" data-tab="games" aria-selected="true">Games</button>
    <button role="tab" data-tab="players" aria-selected="false">Player projections</button>
    <button role="tab" data-tab="props" aria-selected="false">Props</button>
    <button role="tab" data-tab="teams" aria-selected="false">Power ratings</button>
    <button role="tab" data-tab="record" aria-selected="false">Track record</button>
  </nav>

  <section id="games" role="tabpanel"></section>
  <section id="players" role="tabpanel" hidden>
    <p class="hint">Average projections. Tap a row for the median (compare this to prop lines) and a realistic range. Q = questionable.</p>
    <div class="controls">
      <select id="fTeam" aria-label="Team"><option value="">All teams</option></select>
      <div class="seg" id="fPos" role="group" aria-label="Position">
        <button aria-pressed="true" data-v="">All</button><button aria-pressed="false" data-v="QB">QB</button>
        <button aria-pressed="false" data-v="RB">RB</button><button aria-pressed="false" data-v="WR">WR</button>
        <button aria-pressed="false" data-v="TE">TE</button>
      </div>
      <input type="search" id="fName" placeholder="Search player" aria-label="Search player">
    </div>
    <div class="tablewrap"><table id="ptable"></table></div>
  </section>
  <section id="props" role="tabpanel" hidden></section>
  <section id="teams" role="tabpanel" hidden>
    <p class="hint">Points per game better (+) or worse (−) than an average team, adjusted for opponents. Net = offense + defense.</p>
    <div class="tablewrap"><table id="ttable"></table></div>
  </section>
  <section id="record" role="tabpanel" hidden></section>
</div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const n = (v, d = 1) => v == null ? "–" : Number(v).toFixed(d);
const sgn = (v, d = 1) => v == null ? "–" : (v > 0 ? "+" : "") + Number(v).toFixed(d);
let D = null, pState = {sort: "fpts", dir: -1, pos: "", team: "", q: "", open: null}, tState = {sort: "net", dir: -1};

document.querySelectorAll("nav button").forEach(b => b.addEventListener("click", () => {
  document.querySelectorAll("nav button").forEach(x => x.setAttribute("aria-selected", x === b));
  document.querySelectorAll("[role=tabpanel]").forEach(s => s.hidden = s.id !== b.dataset.tab);
}));

fetch("data/latest.json?ts=" + Date.now()).then(r => {
  if (!r.ok) throw new Error("No results file yet");
  return r.json();
}).then(d => { D = d; render(); }).catch(() => {
  $("#sub").textContent = "No results yet";
  $("#games").innerHTML = `<div class="msg">The model has not run yet. On GitHub, open the Actions tab, pick "Weekly NFL model", and press Run workflow. Results appear here about 5 minutes later.</div>`;
});

function render() {
  const when = new Date(D.generated_at);
  $("#sub").textContent = D.week ? `${D.season} season, week ${D.week}` : `${D.season} season`;
  $("#updated").textContent = "Updated " + when.toLocaleString([], {weekday: "short", month: "short", day: "numeric", hour: "numeric", minute: "2-digit"});
  if (!D.games) { $("#games").innerHTML = `<div class="msg">${esc(D.message || "No games to show.")}</div>`; renderRecord(); return; }
  renderGames(); initPlayers(); renderPlayers(); renderProps(); renderTeams(); renderRecord();
}

function renderGames() {
  const leans = [];
  const line = v => v == null ? "–" : (Math.abs(v) < 0.25 ? "PK" : (v > 0 ? "+" : "") + v.toFixed(1));
  D.games.forEach(g => {
    if (g.state !== "upcoming") return;
    if (g.lean_side) {
      const home = g.lean_side === g.home, vegas = home ? -g.market_spread : g.market_spread, model = home ? -g.margin : g.margin;
      leans.push({e: Math.abs(g.edge_spread), html: `<b>${esc(g.lean_side)} ${line(vegas)}</b> <span>Model has ${esc(g.lean_side)} ${line(model)}. Edge ${n(Math.abs(g.edge_spread))} pts.</span>`});
    }
    if (g.lean_total) leans.push({e: Math.abs(g.edge_total), html: `<b>${esc(g.lean_total)} ${n(g.market_total)}</b> <span>${esc(g.away)} at ${esc(g.home)}. Model total ${n(g.total)}.</span>`});
  });
  leans.sort((a, b) => b.e - a.e);
  const TOP = 6;
  let h = `<h2>This week's leans</h2><p class="hint">Biggest gaps between the model and Vegas (${n(D.settings.lean_spread,0)}+ pts on spreads, ${n(D.settings.lean_total,0)}+ on totals). A lean is a starting point for your own research, not a sure thing.</p>`;
  if (leans.length) {
    h += `<div class="leans">${leans.slice(0, TOP).map(l => `<div class="lean">${l.html}</div>`).join("")}</div>`;
    if (leans.length > TOP) h += `<div class="leans" id="moreLeans" hidden>${leans.slice(TOP).map(l => `<div class="lean">${l.html}</div>`).join("")}</div><button class="more" id="moreBtn" aria-expanded="false">Show ${leans.length - TOP} more leans</button>`;
  } else h += `<p class="hint">No leans this week. The model mostly agrees with Vegas.</p>`;
  h += `<h2>All games</h2>`;
  for (const g of D.games) {
    const ko = g.kickoff ? new Date(g.kickoff).toLocaleString([], {weekday: "short", hour: "numeric", minute: "2-digit"}) : "";
    const st = g.state === "final" ? `<span class="state final">Final ${g.final_away}–${g.final_home}</span>` : g.state === "locked" ? `<span class="state">Locked at kickoff</span>` : `<span class="state">${esc(ko)}${g.neutral ? ", neutral site" : ""}</span>`;
    const wpA = g.win_prob_home == null ? null : 100 - g.win_prob_home;
    const spreadFlag = g.lean_side ? ` <span class="flag">Lean ${esc(g.lean_side)}</span>` : "";
    const totFlag = g.lean_total ? ` <span class="flag">Lean ${esc(g.lean_total)}</span>` : "";
    const inj = [...(g.injuries_away || []).map(x => `${g.away} ${x.name} (${x.pos}, ${x.status.toLowerCase()})`), ...(g.injuries_home || []).map(x => `${g.home} ${x.name} (${x.pos}, ${x.status.toLowerCase()})`)];
    h += `<article class="game">
      <div class="grow"><div class="tm">${esc(g.away)}</div><div class="score">${n(g.proj_away)}</div>
        <div class="cell">Win chance<strong>${n(wpA,0)}%</strong></div>
        <div class="cell">Model line<strong>${esc(g.model_line || "–")}</strong></div>
        <div class="cell">Vegas line<strong>${esc(g.market_line || "not posted")}</strong>${spreadFlag}</div></div>
      <div class="grow"><div class="tm">${esc(g.home)}</div><div class="score">${n(g.proj_home)}</div>
        <div class="cell">Win chance<strong>${n(g.win_prob_home,0)}%</strong></div>
        <div class="cell">Model total<strong>${n(g.total)}</strong></div>
        <div class="cell">Vegas total<strong>${g.market_total == null ? "not posted" : n(g.market_total)}</strong>${totFlag}</div></div>
      <div class="gfoot">${st}<span class="qb">QBs: ${esc(g.qb_away)} / ${esc(g.qb_home)}</span>
        ${g.weather ? `<span>${esc(g.weather)}</span>` : ""}
        ${(g.why_margin || []).length ? `<span class="why"><b>Why this line:</b> ${g.why_margin.map(w => `${esc(w.factor)} ${w.pts > 0 ? "favors " + esc(g.home) : "favors " + esc(g.away)} ${n(Math.abs(w.pts))}`).join(", ")}</span>` : ""}
        ${(g.why_total || []).length ? `<span class="why"><b>Why this total:</b> ${g.why_total.map(w => `${esc(w.factor)} ${sgn(w.pts)}`).join(", ")}</span>` : ""}
        ${(g.notes || []).map(x => `<span>${esc(x)}</span>`).join("")}
        ${inj.length ? `<span class="inj">Key injuries: ${esc(inj.join(", "))}</span>` : ""}</div>
    </article>`;
  }
  $("#games").innerHTML = h;
  const mb = $("#moreBtn");
  if (mb) mb.onclick = () => { const m = $("#moreLeans"); m.hidden = !m.hidden; mb.setAttribute("aria-expanded", !m.hidden); mb.textContent = m.hidden ? `Show ${m.children.length} more leans` : "Show fewer"; };
}

const PCOLS = [
  ["name", "Player"], ["opp", "Opp"], ["pass_yds", "Pass yds"], ["pass_td", "Pass TD"], ["pass_int", "INT"],
  ["carries", "Carries"], ["rush_yds", "Rush yds"], ["targets", "Targets"], ["rec", "Rec"], ["rec_yds", "Rec yds"],
  ["td_prob", "Any TD %"], ["fpts", "PPR pts"]];
const DIGITS = {pass_yds: 0, rush_yds: 0, rec_yds: 0, td_prob: 0, pass_td: 1, pass_int: 1};

function initPlayers() {
  const teams = [...new Set(D.players.map(p => p.team))].sort();
  $("#fTeam").innerHTML = `<option value="">All teams</option>` + teams.map(t => `<option>${esc(t)}</option>`).join("");
  $("#fTeam").onchange = e => { pState.team = e.target.value; renderPlayers(); };
  $("#fName").oninput = e => { pState.q = e.target.value.toLowerCase(); renderPlayers(); };
  document.querySelectorAll("#fPos button").forEach(b => b.onclick = () => {
    document.querySelectorAll("#fPos button").forEach(x => x.setAttribute("aria-pressed", x === b));
    pState.pos = b.dataset.v; renderPlayers();
  });
}

function renderPlayers() {
  let rows = D.players.filter(p => (!pState.pos || p.pos === pState.pos) && (!pState.team || p.team === pState.team) && (!pState.q || p.name.toLowerCase().includes(pState.q)));
  const k = pState.sort;
  rows.sort((a, b) => k === "name" || k === "opp" ? pState.dir * String(a[k]).localeCompare(String(b[k])) : pState.dir * ((a[k] ?? -1) - (b[k] ?? -1)));
  rows = rows.slice(0, 250);
  let h = "<thead><tr>" + PCOLS.map(([c, l]) => `<th data-k="${c}" class="${c === k ? "sorted" : ""}" scope="col">${l}${c === k ? (pState.dir < 0 ? " ▾" : " ▴") : ""}</th>`).join("") + "</tr></thead><tbody>";
  for (const p of rows) {
    const key = p.pid + p.game_id;
    h += `<tr class="p" data-key="${esc(key)}" tabindex="0"><td><span class="pname">${esc(p.name)}</span><span class="pos">${esc(p.pos)} ${esc(p.team)}</span>${p.status ? `<span class="qtag">${esc(p.status)}</span>` : ""}</td>` +
      PCOLS.slice(1).map(([c]) => `<td>${c === "opp" ? esc(p.opp) : n(p[c], DIGITS[c] ?? 1)}</td>`).join("") + "</tr>";
    if (pState.open === key) {
      const parts = [];
      if (p.pass_yds != null) parts.push(`Passing yards: median <b>${n(p.pass_yds_med,0)}</b>, likely range ${n(p.pass_yds_range[0],0)} to ${n(p.pass_yds_range[1],0)}. Completions ${n(p.pass_cmp)} of ${n(p.pass_att)}.`);
      if (p.rush_yds != null) parts.push(`Rushing yards: median <b>${n(p.rush_yds_med,0)}</b>, likely range ${n(p.rush_yds_range[0],0)} to ${n(p.rush_yds_range[1],0)}. Rush TDs ${n(p.rush_td,2)}.`);
      if (p.rec_yds != null) parts.push(`Receiving yards: median <b>${n(p.rec_yds_med,0)}</b>, likely range ${n(p.rec_yds_range[0],0)} to ${n(p.rec_yds_range[1],0)}. Rec TDs ${n(p.rec_td,2)}.`);
      if (p.fpts_med != null) parts.push(`PPR points: median <b>${n(p.fpts_med)}</b>, likely range ${n(p.fpts_range[0])} to ${n(p.fpts_range[1])}.`);
      h += `<tr class="detail"><td colspan="${PCOLS.length}">${parts.join("<br>")}<br>Range covers 80% of simulated outcomes. For props, compare the line to the median, not the average.</td></tr>`;
    }
  }
  h += "</tbody>";
  const t = $("#ptable"); t.innerHTML = h;
  t.querySelectorAll("th").forEach(th => th.onclick = () => { const c = th.dataset.k; pState.dir = pState.sort === c ? -pState.dir : (c === "name" || c === "opp" ? 1 : -1); pState.sort = c; renderPlayers(); });
  t.querySelectorAll("tr.p").forEach(tr => { const toggle = () => { pState.open = pState.open === tr.dataset.key ? null : tr.dataset.key; renderPlayers(); }; tr.onclick = toggle; tr.onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggle(); } }; });
}

const TCOLS = [["team", "Team"], ["net", "Net"], ["off", "Offense"], ["def", "Defense"], ["off_pass", "Pass off"], ["off_rush", "Run off"], ["def_pass", "Pass def"], ["def_rush", "Run def"], ["pace", "Plays/gm"], ["proe", "Pass rate vs expected"]];
function renderTeams() {
  const rows = [...D.teams]; const k = tState.sort;
  rows.sort((a, b) => k === "team" ? tState.dir * a.team.localeCompare(b.team) : tState.dir * (a[k] - b[k]));
  const max = Math.max(...D.teams.map(t => Math.abs(t.net)), 1);
  let h = "<thead><tr>" + TCOLS.map(([c, l]) => `<th data-k="${c}" class="${c === k ? "sorted" : ""}" scope="col">${l}</th>`).join("") + "</tr></thead><tbody>";
  for (const t of rows) {
    const w = Math.round(60 * Math.abs(t.net) / max);
    h += `<tr><td><b>${esc(t.team)}</b></td><td><span class="bar ${t.net < 0 ? "neg" : ""}" style="width:${w}px"></span> ${sgn(t.net)}</td>` +
      ["off", "def", "off_pass", "off_rush", "def_pass", "def_rush"].map(c => `<td class="${t[c] < 0 ? "neg-t" : "pos-t"}">${sgn(t[c])}</td>`).join("") +
      `<td>${n(t.pace)}</td><td>${sgn(t.proe)}%</td></tr>`;
  }
  const tb = $("#ttable"); tb.innerHTML = h + "</tbody>";
  tb.querySelectorAll("th").forEach(th => th.onclick = () => { const c = th.dataset.k; tState.dir = tState.sort === c ? -tState.dir : (c === "team" ? 1 : -1); tState.sort = c; renderTeams(); });
}

function renderProps() {
  const P = D.props || {props: [], pairs: []};
  let h = `<h2>Your prop lines</h2><p class="hint">Add lines from your sportsbook to <b>data/props.csv</b> on GitHub (instructions are inside the file), then re-run the model. Each prop is checked against ${"10,000"} simulated games. A lean appears when the model differs from the book by 4%+ after removing the vig.</p>`;
  if (!P.props.length) {
    h += `<div class="msg">No props entered yet. Open data/props.csv in your GitHub repository, click the pencil icon, add rows like <b>Patrick Mahomes,KC,pass_yds,262.5,-115,-105</b>, commit, then run the workflow.</div>`;
  } else {
    h += `<div class="tablewrap"><table><thead><tr><th scope="col">Player</th><th scope="col">Prop</th><th scope="col">Line</th><th scope="col">Model median</th><th scope="col">Model over %</th><th scope="col">Book over %</th><th scope="col">Edge</th><th scope="col">Lean</th></tr></thead><tbody>`;
    for (const p of P.props) {
      if (p.error) { h += `<tr><td>${esc(p.player)}</td><td>${esc(p.stat)}</td><td>${esc(p.line ?? "")}</td><td class="err" colspan="5">${esc(p.error)}</td></tr>`; continue; }
      const cls = p.lean === "Over" ? "lean-o" : p.lean === "Under" ? "lean-u" : "";
      h += `<tr><td><span class="pname">${esc(p.player)}</span><span class="pos">${esc(p.pos)} ${esc(p.team)} vs ${esc(p.opp)}</span></td><td>${esc(p.stat)}</td><td>${esc(p.line ?? "–")}</td><td>${n(p.median)}</td><td>${n(p.model_over)}%</td><td>${n(p.book_over)}%</td><td>${sgn(p.edge)}%</td><td class="${cls}">${esc(p.lean || "")}</td></tr>`;
    }
    h += `</tbody></table></div>`;
  }
  h += `<h2>Same-game pairs</h2><p class="hint">Leans on the same team that tend to hit together. "Lift" is how much more often both hit than if they were unrelated. Sportsbooks price some of this into parlays, so treat it as research.</p>`;
  h += (P.pairs || []).length ? `<div class="pairs">${P.pairs.map(x => `<div class="pair"><b>${esc(x.legs[0])}</b> + <b>${esc(x.legs[1])}</b><br><span>Both hit ${n(x.joint)}% of sims vs ${n(x.if_independent)}% if unrelated (+${n(x.lift,0)}% lift)</span></div>`).join("")}</div>` : `<p class="hint">No correlated pairs among this week's leans.</p>`;
  $("#props").innerHTML = h;
}

function rec(r) { if (!r || !(r[0] + r[1])) return "–"; return `${r[0]}–${r[1]}`; }
function pct(r) { if (!r || !(r[0] + r[1])) return ""; return ` (${(100 * r[0] / (r[0] + r[1])).toFixed(1)}%)`; }
function renderRecord() {
  const L = D.live_record || {}, B = D.backtest || {}, M = D.model || {}, DB = M.deep_backtest;
  let h = `<h2>This season, published picks</h2><p class="hint">Graded against the Vegas line saved at the time of each pick. Beating 52.4% against the spread is the break-even point at standard odds.</p>
  <div class="stats">
    <div class="stat"><strong>${rec(L.ats_leans)}</strong><span>Spread leans${pct(L.ats_leans)}</span></div>
    <div class="stat"><strong>${rec(L.totals_leans)}</strong><span>Total leans${pct(L.totals_leans)}</span></div>
    <div class="stat"><strong>${rec(L.ats_all)}</strong><span>Every game vs spread${pct(L.ats_all)}</span></div>
    <div class="stat"><strong>${rec(L.straight_up)}</strong><span>Winners picked${pct(L.straight_up)}</span></div>
    <div class="stat"><strong>${n(L.model_mae)} / ${n(L.vegas_mae)}</strong><span>Avg miss on margin, model / Vegas (lower wins)</span></div>
  </div>`;
  if (DB && DB.overall) {
    const O = DB.overall;
    h += `<h2>Deep backtest</h2><p class="hint">Walk-forward test: each season predicted by a model trained only on earlier seasons. ${O.games} games. This is the honest measure of the model.</p>
    <div class="stats">
      <div class="stat"><strong>${rec(O.ats_leans)}</strong><span>Spread leans${pct(O.ats_leans)}</span></div>
      <div class="stat"><strong>${rec(O.totals_leans)}</strong><span>Total leans${pct(O.totals_leans)}</span></div>
      <div class="stat"><strong>${rec(O.ats_all)}</strong><span>Every game vs spread${pct(O.ats_all)}</span></div>
      <div class="stat"><strong>${n(O.model_mae)} / ${n(O.vegas_mae)}</strong><span>Avg miss on margin, model / Vegas</span></div>
      <div class="stat"><strong>${n(O.model_mae_total)} / ${n(O.vegas_mae_total)}</strong><span>Avg miss on total, model / Vegas</span></div>
    </div>
    <div class="tablewrap" style="margin-top:12px"><table><thead><tr><th scope="col">Season</th><th scope="col">Games</th><th scope="col">Spread leans</th><th scope="col">Total leans</th><th scope="col">All vs spread</th><th scope="col">Miss: model</th><th scope="col">Miss: Vegas</th></tr></thead><tbody>
    ${DB.by_season.map(r => `<tr><td>${r.season}</td><td>${r.games}</td><td>${rec(r.ats_leans)}${pct(r.ats_leans)}</td><td>${rec(r.totals_leans)}${pct(r.totals_leans)}</td><td>${rec(r.ats_all)}${pct(r.ats_all)}</td><td>${n(r.model_mae)}</td><td>${n(r.vegas_mae)}</td></tr>`).join("")}
    </tbody></table></div>`;
  } else if (B.games) {
    h += `<h2>Backtest</h2><p class="hint">${B.games} recent games. Run the "Train model" workflow once to unlock the deep, multi-season backtest.</p>
    <div class="stats">
      <div class="stat"><strong>${rec(B.ats_leans)}</strong><span>Spread leans${pct(B.ats_leans)}</span></div>
      <div class="stat"><strong>${rec(B.totals_leans)}</strong><span>Total leans${pct(B.totals_leans)}</span></div>
      <div class="stat"><strong>${n(B.model_mae_margin)} / ${n(B.vegas_mae_margin)}</strong><span>Avg miss on margin, model / Vegas</span></div>
    </div>`;
  }
  if ((M.weights_margin || []).length) {
    h += `<h2>What the model learned</h2><p class="hint">Points of spread moved by a typical swing (one standard deviation) in each factor. Learned from ${M.history_games} games (${(M.seasons || [])[0]} to now). Machine-learning share: ${n((DB?.gbm_share_margin || 0) * 100, 0)}% for spreads, ${n((DB?.gbm_share_total || 0) * 100, 0)}% for totals.</p>
    <div class="stats">${M.weights_margin.slice(0, 8).map(w => `<div class="stat"><strong>${sgn(w.pts)}</strong><span>${esc(w.factor)}</span></div>`).join("")}</div>`;
  }
  h += `<h2>Model settings this week</h2><p class="hint">Engine: ${esc(M.engine || "–")}. Coverage matchups ${D.scheme_enabled ? "on" : "off (data not published)"}. Vegas blend ${n((D.settings||{}).market_weight*100,0)}%.${M.deep_history ? "" : " Deep history not built yet: run the Train model workflow."}</p>
  <h2>Data sources</h2><div class="chips">${Object.entries(D.data_status || {}).map(([k, v]) => `<span class="chip ${v.ok ? "ok" : "bad"}" title="${esc(v.note)}">${esc(k.replaceAll("_", " "))}</span>`).join("")}</div>
  <p class="hint" style="margin-top:10px">A red source means that feed was unavailable this run. The model keeps working without it and fills the gap with defaults.</p>`;
  $("#record").innerHTML = h;
}
</script>
</body>
</html>
