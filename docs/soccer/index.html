<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F5F5F5">
<script>try{var t=localStorage.getItem("board.theme");if(t!=="dark")document.documentElement.dataset.theme="light"}catch(e){}</script>
<title>The Board: Soccer model</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%23FF682C'/><path d='M9 21l5-6 4 3 5-8' stroke='%23FFFFFF' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
/* =====================================================================
   Tokens. Dark-first "trading desk": graphite tinted toward garnet,
   garnet for structure, gold only for edges and Plays.
   ===================================================================== */
:root{
  --ground:#141414; --ground-2:#181818; --surface:#1D1D1D; --raised:#242424; --hover:#2A2A2A;
  --line:#333333; --line-soft:#282828;
  --ink:#F3F3F1; --muted:#A3A3A0; --faint:#73736F;
  --garnet:#F3F3F1; --garnet-hi:#FFFFFF; --garnet-text:#D9B867; --garnet-soft:rgba(255,255,255,.07);
  --gold:#FF682C; --gold-text:#FF8A57; --gold-soft:rgba(255,104,44,.12); --gold-line:rgba(255,104,44,.42);
  --win:#4CC48A; --loss:#F0727D; --win-soft:rgba(76,196,138,.13);
  --on-garnet:#141414; --on-garnet-muted:#555; --on-gold:#FFFFFF;
  --beige:#221E19; --brown:#D9B867; --pill:#262626;
  --shadow:0 1px 2px rgba(0,0,0,.3);
  --team-on:1;
  --sans:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --num:"Inter Tight","Inter",system-ui,sans-serif;
  --r-sm:10px; --r:14px; --r-lg:20px;
  --side:236px;
  color-scheme:dark;
}
:root[data-theme="light"]{
  --ground:#F5F5F5; --ground-2:#EFEFEF; --surface:#FFFFFF; --raised:#FAFAF9; --hover:#F3F2F0;
  --line:#E4E4E2; --line-soft:#EEEEEC;
  --ink:#202020; --muted:#5E5E5E; --faint:#8D8D8D;
  --garnet:#202020; --garnet-hi:#000000; --garnet-text:#816729; --garnet-soft:rgba(32,32,32,.06);
  --gold:#FF682C; --gold-text:#C94E1A; --gold-soft:rgba(255,104,44,.08); --gold-line:rgba(255,104,44,.38);
  --win:#1C8A55; --loss:#C8323C; --win-soft:rgba(28,138,85,.10);
  --on-garnet:#FFFFFF; --on-garnet-muted:#CFCFCF; --on-gold:#FFFFFF;
  --beige:#EBE6DD; --brown:#816729; --pill:#E9E9E7;
  --shadow:0 1px 2px rgba(20,20,20,.04);
  --team-on:0;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:80px}
body{margin:0;background:var(--ground);color:var(--ink);font:400 15px/1.55 var(--sans);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(1200px 500px at 20% -120px,rgba(142,34,54,.18),transparent 70%)}
:root[data-theme="light"] body{background-image:radial-gradient(1200px 500px at 20% -120px,rgba(142,34,54,.06),transparent 70%)}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:4px}
[hidden]{display:none!important}
button{font-family:inherit}

/* =====================================================================
   App shell: sidebar on desktop, top bar + bottom tab bar on phones
   ===================================================================== */
.app{display:grid;grid-template-columns:var(--side) minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px;padding:20px 14px 16px;border-right:1px solid var(--line-soft);background:linear-gradient(180deg,rgba(142,34,54,.10),transparent 260px)}
.brand{display:flex;align-items:center;gap:11px;padding:4px 8px 18px}
.mark{width:34px;height:34px;border-radius:9px;background:var(--garnet);display:grid;place-items:center;flex:none;box-shadow:0 6px 18px -6px rgba(179,48,73,.7)}
.mark svg{width:20px;height:20px}
.brand h1{margin:0;font:600 21px/1 var(--num);--fs:85%;letter-spacing:.2px}
.brand small{display:block;font:500 12.5px var(--sans);color:var(--muted);margin-top:3px}
nav.sidenav{display:grid;gap:2px}
nav button{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;color:var(--muted);font:600 14px var(--sans);padding:10px 12px;border-radius:var(--r-sm);cursor:pointer;position:relative;text-align:left;transition:background .15s,color .15s}
nav button svg{width:19px;height:19px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button:hover{background:var(--hover);color:var(--ink)}
nav button[aria-selected="true"]{background:var(--garnet-soft);color:var(--ink)}
nav.sidenav button[aria-selected="true"]::before{content:"";position:absolute;left:-14px;top:9px;bottom:9px;width:3px;border-radius:0 3px 3px 0;background:var(--gold)}
nav button[aria-selected="true"] svg{stroke:var(--gold)}
.side-foot{margin-top:auto;display:grid;gap:10px;padding:12px 8px 0;border-top:1px solid var(--line-soft)}
.fresh{display:inline-flex;align-items:center;gap:8px;font:500 12.5px var(--sans);color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--win);box-shadow:0 0 0 3px var(--win-soft);flex:none}
.fresh.stale{color:var(--loss)}.fresh.stale .dot{background:var(--loss);box-shadow:0 0 0 3px rgba(240,115,133,.15)}
.themebtn{display:inline-flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);color:var(--muted);font:600 12.5px var(--sans);padding:7px 10px;border-radius:999px;cursor:pointer;width:max-content}
.themebtn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8}
.topbar{display:none}
.tabbar{display:none}
main.wrap{min-width:0;max-width:1180px;width:100%;margin:0 auto;padding:8px 32px 90px}
.foot{grid-column:2;max-width:1180px;margin:0 auto;padding:0 32px 36px;font-size:12px;color:var(--faint);width:100%}

@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .side{display:none}
  .topbar{display:flex;position:sticky;top:0;z-index:20;align-items:center;justify-content:space-between;gap:10px;padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 10px;background:rgba(18,14,16,.86);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid var(--line-soft)}
  :root[data-theme="light"] .topbar{background:rgba(243,240,239,.88)}
  .topbar .brand{padding:0}
  .topbar .mark{width:28px;height:28px;border-radius:7px}.topbar .mark svg{width:16px;height:16px}
  .topbar h1{font-size:19px}
  .tabbar{display:grid;grid-template-columns:repeat(6,1fr);position:fixed;left:0;right:0;bottom:0;z-index:20;padding:6px 6px calc(env(safe-area-inset-bottom,0px) + 6px);background:rgba(22,17,19,.92);backdrop-filter:saturate(1.4) blur(16px);-webkit-backdrop-filter:saturate(1.4) blur(16px);border-top:1px solid var(--line-soft)}
  :root[data-theme="light"] .tabbar{background:rgba(255,255,255,.92)}
  .tabbar button{flex-direction:column;gap:3px;padding:6px 2px;font-size:10.5px;justify-content:center;text-align:center;border-radius:8px}
  .tabbar button svg{width:21px;height:21px}
  .tabbar button[aria-selected="true"]{background:none;color:var(--ink)}
  main.wrap{padding:4px 16px 96px}
  .foot{grid-column:1;padding:0 16px 100px}
}

/* =====================================================================
   Type and section scaffolding
   ===================================================================== */
h2{font:600 24px/1.15 var(--num);--fs:88%;margin:38px 0 6px;letter-spacing:.1px}
h3{font:600 16px/1.3 var(--sans);margin:26px 0 10px}
.sec-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin:38px 0 10px}
.sec-head h2{margin:0}
.sec-head .aside{font-size:12.5px;color:var(--faint)}
section>h2:first-child,section>.sec-head:first-child,section>.week:first-child,section>.view-seg:first-child,section>.home-hero:first-child{margin-top:24px}
.sub{color:var(--muted);font-size:14px;margin:0 0 16px;max-width:74ch;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;cursor:pointer;position:relative}
.sub.open{-webkit-line-clamp:unset;display:block;cursor:auto}
.sub b{color:var(--ink);font-weight:600}
.note{font-size:12.5px;color:var(--faint);margin-top:10px;max-width:84ch}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:20px 22px;color:var(--muted)}
.empty b{color:var(--ink)}
.dim{color:var(--muted)}
.up{color:var(--win)}.down{color:var(--loss)}
.v-above{color:var(--win)!important}.v-below{color:var(--loss)!important}.v-unclear{color:var(--ink)}
.gold{color:var(--gold-text)}

/* panels: one depth system */
.panel,.ticket,.board,.tablewrap,.strip,.fold,.plist,.legform,.verdict,.gapcard,.leg,.pmath,.empty,.tile{box-shadow:var(--shadow)}

/* =====================================================================
   Signature: edge meter (book marker, model fill, gold gap)
   ===================================================================== */
.meter{display:grid;grid-template-columns:1fr auto;align-items:center;gap:10px;margin-top:10px}
.m-track{position:relative;height:8px;border-radius:999px;background:var(--line-soft);overflow:visible}
.m-fill{position:absolute;left:0;top:0;bottom:0;border-radius:999px;background:linear-gradient(90deg,rgba(142,34,54,.55),var(--garnet-hi));transition:width .9s cubic-bezier(.2,.8,.2,1)}
.m-gap{position:absolute;top:-2px;bottom:-2px;border-radius:3px;background:var(--gold);box-shadow:0 0 12px rgba(226,182,82,.55);transition:width .9s cubic-bezier(.2,.8,.2,1)}
.m-book{position:absolute;top:-5px;bottom:-5px;width:2px;background:var(--ink);opacity:.85;border-radius:1px}
.m-lab{font:600 12.5px var(--num);--fs:90%;color:var(--muted);white-space:nowrap}
.m-lab b{color:var(--gold-text);font-weight:700}

/* =====================================================================
   Home dashboard
   ===================================================================== */
.home-hero{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:end;gap:18px 28px;padding:30px 30px 26px;border-radius:var(--r-lg);border:1px solid var(--line);background:
  radial-gradient(600px 220px at 85% 0%,rgba(226,182,82,.10),transparent 70%),
  radial-gradient(700px 260px at 0% 100%,rgba(142,34,54,.30),transparent 70%),var(--surface);box-shadow:var(--shadow);margin-top:24px}
.home-hero .eyebrow{font:600 13px var(--sans);color:var(--muted)}
.home-hero .big{font:600 76px/.88 var(--num);--fs:80%;letter-spacing:-1px;margin:6px 0 8px}
.home-hero .big span{font-size:26px;font-weight:600;color:var(--muted);letter-spacing:0;margin-left:6px}
.home-hero .line{color:var(--muted);font-size:14.5px}
.home-hero .line b{color:var(--ink);font-weight:600}
.hero-stats{display:grid;grid-template-columns:repeat(3,auto);gap:4px 26px;text-align:right}
.hs b{display:block;font:600 30px/1 var(--num);--fs:85%}
.hs span{font-size:12.5px;color:var(--muted)}
.hs b.gold{color:var(--gold-text)}
.dash{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px;margin-top:16px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px 20px;min-width:0}
.panel h3{margin:0 0 4px;font:600 17px var(--num);--fs:90%;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.panel h3 a,.panel h3 button{font:600 12.5px var(--sans);color:var(--garnet-text);background:none;border:0;cursor:pointer;padding:0;text-decoration:none}
.panel .pmuted{font-size:12.5px;color:var(--faint);margin:0 0 10px}
.span-8{grid-column:span 8}.span-4{grid-column:span 4}.span-6{grid-column:span 6}.span-12{grid-column:span 12}
.bets-list{display:grid;gap:10px}
.bet{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 14px;align-items:center;padding:12px 14px;border-radius:var(--r);background:var(--raised);border:1px solid var(--line-soft)}
.bet .k{font:600 11.5px var(--sans);color:var(--muted)}
.bet .bpk{font:600 19px/1.15 var(--num);--fs:88%}
.bet .bpk small{font:600 13px var(--num);color:var(--muted);margin-left:6px}
.bet .who{font-size:12.5px;color:var(--muted)}
.bet .gapv{font:600 22px/1 var(--num);--fs:85%;color:var(--gold-text);text-align:right}
.bet .gapv small{display:block;font:500 11px var(--sans);color:var(--faint);margin-top:2px}
.bet .meter{grid-column:1/-1;margin-top:4px}
.bet .icon{width:36px;height:36px;border-radius:9px;display:grid;place-items:center;background:var(--garnet-soft);color:var(--garnet-text)}
.bet .icon svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.spark{width:100%;height:120px;display:block}
.spark .zero{stroke:var(--line);stroke-dasharray:3 4}
.spark .lineup{stroke:var(--gold);fill:none;stroke-width:2.2}
.spark .area{fill:url(#sparkfill)}
.spark text{fill:var(--faint);font:500 11px var(--sans)}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
/* record by bet type (Home) */
.rtype td{padding:9px 14px}
.rtype tr.grp td{background:var(--raised);font-weight:600}
.rtype tr.grp td:first-child{font:600 14px var(--sans)}
.rtype tr.kid td:first-child{padding-left:28px;color:var(--muted)}
.rtype tr.all td{border-top:1px solid var(--line);border-bottom:0;font-weight:600}
.rtype tr.all td:first-child{font:600 14px var(--sans)}
.rtype .roi{display:block;font:400 11.5px var(--sans);color:var(--faint)}
.rtype .flag{display:inline-block;margin-left:6px;font:600 10.5px var(--sans);color:var(--loss);border:1px solid currentColor;border-radius:999px;padding:0 6px;vertical-align:1px}
.multi .l{fill:none;stroke-width:1.8;stroke-linejoin:round}
.multi .l.all{stroke:var(--gold);stroke-width:2.6}.multi .l.game{stroke:var(--ink)}.multi .l.prop{stroke:var(--brown)}.multi .l.edge{stroke:var(--muted);stroke-dasharray:4 3}
@media (max-width:640px){.rtype td,.rtype th{padding:8px 9px}.rtype td:first-child{white-space:normal}.rtype tr.kid td:first-child{padding-left:18px}.rtype td{font-size:14px}}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:6px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:14px;height:0;border-top:2px solid;vertical-align:middle;margin-right:5px}
.legend b{font:600 12px var(--num);margin-left:3px}
.kpi{background:var(--raised);border:1px solid var(--line-soft);border-radius:var(--r);padding:10px 12px}
.kpi b{display:block;font:600 22px/1.1 var(--num);--fs:88%}
.kpi span{font-size:12px;color:var(--muted)}
.slate{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.tile{background:var(--raised);border:1px solid var(--line-soft);border-radius:var(--r);padding:12px 13px;cursor:pointer;transition:border-color .15s,transform .15s;text-align:left;color:inherit;font:inherit}
.tile:hover{border-color:var(--gold-line);transform:translateY(-1px)}
.tile .tt{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted)}
.tile .tr{display:flex;align-items:center;gap:8px;margin-top:7px}
.tile .tr b{font:600 17px var(--num);--fs:88%;margin-left:auto}
.tile .wp{margin-top:9px}
.tile .tp{font-size:12.5px;color:var(--muted);margin-top:8px}
.tile .tp b{color:var(--ink);font-weight:600}
.rail{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(250px,1fr);gap:10px;overflow-x:auto;scrollbar-width:thin;padding-bottom:4px}
.rail .alt{background:var(--raised);border:1px solid var(--line-soft);border-radius:var(--r);padding:12px 14px;display:grid;gap:3px}
.rail .alt .hd{display:flex;justify-content:space-between;align-items:baseline}
.rail .alt .hd b{font:600 16px var(--num);--fs:88%}
.rail .alt .hd span{font:600 20px var(--num);color:var(--gold-text)}
.rail .alt div.l{font-size:12.5px;color:var(--muted)}
.rail .alt div.l b{color:var(--ink);font-weight:600}
@media (max-width:1100px){.span-8,.span-4,.span-6{grid-column:span 12}}
@media (max-width:640px){
  .home-hero{grid-template-columns:1fr;padding:22px 20px 20px}
  .home-hero .big{font-size:60px}
  .hero-stats{text-align:left;grid-template-columns:repeat(3,1fr);gap:4px 14px}
  .hs b{font-size:24px}
  .panel{padding:16px}
}

/* =====================================================================
   Week header (games tab)
   ===================================================================== */
.week{display:grid;grid-template-columns:auto 1fr;align-items:end;gap:6px 30px;padding:24px 0 20px;border-bottom:1px solid var(--line)}
.week .wk{font:600 58px/.9 var(--num);--fs:80%;letter-spacing:-.5px}
.week .wk span{font-size:20px;font-weight:600;color:var(--muted);letter-spacing:0;margin-left:4px}
.week .facts{display:flex;flex-wrap:wrap;gap:6px 30px;padding-bottom:4px}
.fact{font-size:12.5px;color:var(--muted)}
.fact b{display:block;font:600 22px/1.15 var(--num);--fs:88%;color:var(--ink)}
.fact b.gold{color:var(--gold-text)}
@media (max-width:640px){.week{grid-template-columns:1fr}.week .wk{font-size:48px}.week .facts{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px}}

/* team badge */
.badge{filter:brightness(calc(1 + var(--team-on) * (var(--tl,1) - 1)));display:inline-grid;place-items:center;min-width:42px;height:24px;padding:0 6px;border-radius:5px;background:var(--tc,#555);color:#fff;font:600 13px/1 var(--num);--fs:88%;letter-spacing:.4px;box-shadow:inset 0 -2px 0 rgba(0,0,0,.2),inset 0 1px 0 rgba(255,255,255,.15)}

/* =====================================================================
   Tickets (plays)
   ===================================================================== */
.tickets{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(100%,440px),1fr))}
.ticket{display:grid;grid-template-columns:1fr auto;background:var(--surface);border:1px solid var(--gold-line);border-radius:var(--r-lg);overflow:hidden;position:relative}
.ticket::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--gold)}
.t-main{padding:15px 18px 14px 21px;min-width:0}
.t-kind{font-size:12px;color:var(--muted);display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.t-kind b{font-weight:600;color:var(--gold-text)}
.t-pick{font:600 28px/1.05 var(--num);--fs:85%;margin:6px 0 4px}
.t-pick small{font:600 16px var(--num);color:var(--muted);margin-left:8px}
.t-who{font-size:14px}.t-who span{color:var(--muted)}
.t-meta{font-size:12.5px;color:var(--muted);margin-top:6px}
.t-meta b{color:var(--ink);font-weight:600}
.t-side{background:var(--gold-soft);border-left:1px dashed var(--gold-line);padding:14px 20px;display:flex;flex-direction:column;justify-content:center;align-items:flex-end;min-width:112px}
.t-gap{font:600 32px/1 var(--num);--fs:82%;color:var(--gold-text)}
.t-gap small{font-size:15px;font-weight:600;margin-left:2px}
.t-gl{font-size:11.5px;color:var(--muted);margin-top:4px}
.t-actions{display:flex;align-items:center;gap:12px;margin-top:10px;flex-wrap:wrap}
@media (max-width:560px){.t-main{padding:13px 13px 12px 17px}.t-side{min-width:84px;padding:10px 13px}.t-pick{font-size:23px}.t-gap{font-size:25px}}
.rules{display:flex;flex-wrap:wrap;gap:6px 24px;margin-top:14px;font-size:12.5px;color:var(--muted)}
.rules b{color:var(--ink);font-weight:600}

/* collapsibles */
details.fold{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-top:12px}
details.fold>summary{cursor:pointer;list-style:none;padding:13px 18px;font-weight:600;display:flex;justify-content:space-between;align-items:center;gap:12px}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary::after{content:"";width:7px;height:7px;border-right:1.6px solid var(--muted);border-bottom:1.6px solid var(--muted);transform:rotate(45deg);margin:0 4px 3px 0;flex:none;transition:transform .2s}
details.fold[open]>summary::after{transform:rotate(-135deg);margin-bottom:-3px}
details.fold>summary span{color:var(--muted);font-weight:400;font-size:13px;margin-left:auto}
details.fold>summary:hover{background:var(--hover);border-radius:var(--r)}
.fold-body{padding:2px 18px 18px}
.fold-body>.sub:first-child{margin-top:0}

/* =====================================================================
   Game board
   ===================================================================== */
.board{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden}
.board-head{display:grid;grid-template-columns:minmax(190px,1.3fr) repeat(4,minmax(80px,1fr));gap:12px;padding:10px 20px;background:var(--raised);border-bottom:1px solid var(--line);font-size:12px;color:var(--muted)}
details.game{border-top:1px solid var(--line-soft);position:relative}
details.game:first-of-type{border-top:0}
details.game.is-play::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--gold)}
details.game>summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:minmax(190px,1.3fr) repeat(4,minmax(80px,1fr));align-items:center;gap:8px 12px;padding:16px 20px 14px;transition:background .15s}
details.game>summary::-webkit-details-marker{display:none}
details.game>summary:hover,details.game[open]>summary{background:var(--raised)}
details.game.flash{animation:flash 1.6s ease}
@keyframes flash{0%,40%{box-shadow:inset 0 0 0 2px var(--gold)}100%{box-shadow:inset 0 0 0 0 transparent}}
.mu{display:grid;gap:6px}
.mu .row{display:flex;align-items:center;gap:10px}
.mu .pts{font:600 20px/1 var(--num);--fs:88%;color:var(--faint)}
.mu .row.fav .pts{color:var(--ink)}
.mu .when{font-size:12.5px;color:var(--muted);margin-top:3px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.kv{font-size:12px;color:var(--muted);line-height:1.3}
.kv .lbl{display:none}
.kv strong{display:block;font:600 18px/1.25 var(--num);--fs:88%;color:var(--ink)}
.kv strong.hl{color:var(--gold-text)}
.tag{display:inline-block;font:700 11px/1 var(--sans);padding:4px 8px;border-radius:999px;background:var(--gold);color:var(--on-gold)}
.tag.watch{background:none;border:1px solid var(--line);color:var(--muted);padding:3px 7px}
.final{color:var(--ink);font-weight:600}
.wp{grid-column:1/-1;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;font:600 12.5px var(--num);--fs:90%;color:var(--muted);margin-top:4px}
.wp .bar{display:flex;height:6px;border-radius:999px;overflow:hidden;background:var(--line-soft)}
.wp .bar i{display:block;height:100%;filter:brightness(calc(1 + var(--team-on) * (var(--tl,1) - 1)))}
.wp .bar i+i{border-left:2px solid var(--surface)}
details.game>summary:hover .wp .bar i+i,details.game[open] .wp .bar i+i{border-left-color:var(--raised)}
.wp .a,.wp .h{min-width:64px}.wp .h{text-align:right}
.picks{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:6px}
.pk{border:1px solid var(--line-soft);border-radius:var(--r-sm);padding:8px 11px;font-size:12px;color:var(--muted);line-height:1.3;min-width:0;background:var(--surface)}
.pk strong{display:block;font:600 16px/1.3 var(--num);--fs:88%;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pk strong small{font-weight:600;color:var(--muted);margin-left:5px}
.pk.on{border-color:var(--gold-line);background:var(--gold-soft)}
.pk.on strong,.pk.on strong small{color:var(--gold-text)}
.g-body{border-top:1px solid var(--line-soft);padding:16px 20px 18px;display:grid;gap:9px;font-size:13.5px;color:var(--muted);background:var(--raised)}
.g-body b{color:var(--ink);font-weight:600}
.g-body .inj{color:var(--loss)}
@media (max-width:720px){
  .board-head{display:none}
  details.game>summary{grid-template-columns:1fr 1fr;row-gap:12px;padding:15px 15px 13px}
  .mu{grid-column:1/-1}
  .kv .lbl{display:inline}.kv{font-size:11.5px}
  .picks{grid-template-columns:1fr;gap:6px}
  .pk{display:flex;justify-content:space-between;align-items:baseline;gap:12px}.pk strong{display:inline}
  .g-body{padding:13px 15px 15px}
}
@media (min-width:721px){.kv .k{display:none}}

/* =====================================================================
   Controls
   ===================================================================== */
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:0 0 16px}
input[type=search],select{font:500 14px var(--sans);background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:var(--r-sm);padding:9px 12px;min-width:0;transition:border-color .15s,box-shadow .15s}
select{appearance:none;-webkit-appearance:none;padding-right:32px;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 15px) 52%,calc(100% - 10px) 52%;background-size:5px 5px;background-repeat:no-repeat}
input[type=search]{flex:1 1 220px;max-width:360px}
input[type=search]:focus,select:focus{border-color:var(--gold);outline:none;box-shadow:0 0 0 3px var(--gold-soft)}
.seg{display:inline-flex;gap:2px;padding:3px;border:1px solid var(--line);border-radius:999px;background:var(--surface)}
.seg button{font:600 13px var(--sans);background:none;color:var(--muted);border:0;padding:7px 14px;border-radius:999px;cursor:pointer;transition:background .15s,color .15s}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--garnet);color:var(--on-garnet);box-shadow:0 4px 12px -4px rgba(142,34,54,.7)}
.view-seg{margin:24px 0 4px}
.more{font:600 13px var(--sans);background:var(--surface);border:1px solid var(--line);color:var(--ink);border-radius:999px;padding:8px 16px;cursor:pointer;margin-top:12px}
.more:hover{border-color:var(--garnet-text);color:var(--garnet-text)}
.btn{font:600 14px var(--sans);border-radius:999px;padding:9px 18px;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--ink);transition:background .15s,border-color .15s}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--garnet);border-color:var(--garnet);color:var(--on-garnet)}
.btn.primary:hover{background:var(--garnet-hi)}
.logbtn{font:600 12px var(--sans);background:transparent;color:var(--garnet-text);border:1px solid var(--line);border-radius:999px;padding:5px 12px;cursor:pointer;white-space:nowrap;transition:border-color .15s,background .15s}
.logbtn:hover{border-color:var(--garnet-text);background:var(--garnet-soft)}
.logbtn.done{color:var(--win);border-color:var(--win);cursor:default;background:var(--win-soft)}
.stake{font-size:12.5px;color:var(--muted)}.stake b{color:var(--ink);font-weight:600}
.logrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

/* props list */
.plist{display:grid;border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;background:var(--surface)}
.prow{display:grid;grid-template-columns:minmax(160px,1.6fr) 1.1fr 1fr .8fr .8fr;gap:10px;align-items:center;padding:12px 18px;border-top:1px solid var(--line-soft);transition:background .15s}
.prow:hover{background:var(--raised)}
.prow:first-child{border-top:0}
.prow.head{font-size:12px;color:var(--muted);background:var(--raised);padding-top:9px;padding-bottom:9px}
.prow .pl{font-weight:600}
.prow .pl span{display:block;font-weight:400;font-size:12.5px;color:var(--muted)}
.prow .pick{font:600 17px var(--num);--fs:88%}
.prow .pick.over{color:var(--win)}.prow .pick.under{color:var(--garnet-text)}
.prow .r{text-align:right}
.prow .gapv{font:600 17px var(--num);--fs:88%;color:var(--gold-text)}
@media (max-width:640px){
  .prow{grid-template-columns:1fr auto;row-gap:2px;padding:11px 14px}.prow.head{display:none}
  .prow .c-prop{grid-column:1}.prow .c-pick{grid-column:2;text-align:right;grid-row:1}
  .prow .c-mb{grid-column:1/-1;font-size:12.5px;color:var(--muted);text-align:left}.prow .c-mb::before{content:"Model / book "}
  .prow .c-gap{grid-column:2;grid-row:2}
}

/* stat strip */
.strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface);overflow:hidden}
.st{padding:16px 20px;border-left:1px solid var(--line-soft)}
.st:first-child{border-left:0}
.st strong{display:block;font:600 28px/1.1 var(--num);--fs:85%}
.st span{font-size:12.5px;color:var(--muted)}

/* tables */
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14px}
th{font:600 12px var(--sans);color:var(--muted);text-align:right;padding:11px 14px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--raised);position:sticky;top:0}
th.sort{cursor:pointer;user-select:none}th.sort:hover{color:var(--ink)}th.sorted{color:var(--gold-text)}
th:first-child,td:first-child{text-align:left}
td{padding:10px 14px;text-align:right;border-bottom:1px solid var(--line-soft);white-space:nowrap;font:500 15px var(--num);--fs:92%}
td:first-child{font:400 14px var(--sans)}
tbody tr:last-child td{border-bottom:0}
tbody tr{transition:background .12s}
tbody tr:hover td{background:var(--hover)}
tr.p{cursor:pointer}
tr.detail>td{background:var(--raised);text-align:left;color:var(--muted);font:400 13.5px/1.7 var(--sans);white-space:normal}
tr.detail b{color:var(--ink)}
tr.small td{color:var(--faint)}
.pname{font-weight:600}
.pos{color:var(--muted);font-size:12.5px;margin-left:6px;font-family:var(--sans)}
.qtag{color:var(--loss);font-weight:600;margin-left:6px;font-size:12.5px}
.tbar{display:inline-block;height:6px;border-radius:3px;background:var(--win);vertical-align:middle;margin-right:8px}
.tbar.neg{background:var(--loss)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);border-radius:999px;padding:4px 11px;font-size:12.5px;background:var(--surface)}
.chip::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:7px;background:var(--win);vertical-align:1px}
.chip.bad::before{background:var(--loss)}

/* touchdowns */
.tdtable th.grp{text-align:center;border-bottom:1px solid var(--line-soft);color:var(--ink);font-weight:600}
.tdtable th.grp+th.grp,.tdtable td.gs,.tdtable th.gs{border-left:1px solid var(--line)}
.tdtable td:first-child,.tdtable th:first-child{position:sticky;left:0;background:var(--surface);z-index:1}
.tdtable thead th:first-child{background:var(--raised);z-index:2}
.tdtable tbody tr:hover td:first-child{background:var(--hover)}
.tdtable .who{display:flex;align-items:center;gap:9px}
.tdtable .who .badge{min-width:36px;height:20px;font-size:11.5px}
.tdtable .who span.m{display:block;font-size:12px;color:var(--muted);font-family:var(--sans)}
.tdtable .pct{font-weight:700}
.tdtable .edge.pos{color:var(--win);font-weight:700}.tdtable .edge.neg{color:var(--faint)}
.tdtable .na{color:var(--faint)}
.tdbar{display:inline-block;width:52px;height:6px;border-radius:999px;background:var(--line-soft);vertical-align:middle;margin-right:9px;overflow:hidden}
.tdbar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--garnet),var(--garnet-text))}
@media (max-width:640px){.tdtable td,.tdtable th{padding:9px 9px}.tdtable .who .badge{display:none}.tdtable .who b{font-size:13px}}
.gaps{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));margin-bottom:6px}
.gapcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:14px 18px;display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:center}
.gapcard .k{font-size:12px;color:var(--muted)}
.gapcard .p{font:600 20px/1.2 var(--num);--fs:88%}
.gapcard .p small{font-weight:600;color:var(--muted);margin-left:6px;font-size:14px}
.gapcard .e{grid-row:1/span 3;grid-column:2;text-align:right;font:600 26px/1 var(--num);--fs:85%;color:var(--win)}
.gapcard .e small{display:block;font:500 11.5px var(--sans);color:var(--muted);margin-top:3px}
.gapcard .w{font-size:12.5px;color:var(--muted)}
.myplays .gapcard .e{color:var(--gold-text)}

/* more markets */
.mkts{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 16px}
.mkts button{font:600 13px var(--sans);background:var(--surface);color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:7px 14px;cursor:pointer;transition:all .15s}
.mkts button:hover{color:var(--ink);border-color:var(--muted)}
.mkts button[aria-pressed="true"]{background:var(--garnet);border-color:var(--garnet);color:var(--on-garnet)}
.mtable tr.p td.fair{font-weight:800;color:var(--gold-text)}
.mtable tr.p[aria-expanded="true"] td{background:var(--raised)}
.ladder{display:grid;gap:14px;padding:6px 0 4px}
.ladder table{width:auto;min-width:min(100%,440px);border:1px solid var(--line-soft);border-radius:var(--r-sm)}
.ladder td,.ladder th{font-size:14px;padding:7px 14px;text-align:right;white-space:nowrap;position:static}
.ladder td:first-child,.ladder th:first-child{text-align:left}
.ladder tbody tr:hover td{background:inherit}
.ladder tr.fairrow td{background:var(--gold-soft);font-weight:700}
.checker{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;font:400 13.5px var(--sans);color:var(--muted)}
.checker input{font:600 16px var(--num);width:92px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:var(--r-sm);padding:7px 10px}
.checker input:focus{border-color:var(--gold);outline:none;box-shadow:0 0 0 3px var(--gold-soft)}
.checker output{color:var(--ink);font:600 15px var(--num)}
.checker .fld{display:flex;align-items:center;gap:7px}
.checker input.odds{width:80px}
.verdict{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);font-size:13.5px}
.verdict.play{border-color:var(--gold-line);background:var(--gold-soft)}
.verdict b{font:600 18px var(--num);--fs:88%;color:var(--ink)}
.verdict.play b{color:var(--gold-text)}
.vt{display:inline-block;font:700 11px/1 var(--sans);padding:4px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.vt.play{background:var(--gold);border-color:var(--gold);color:var(--on-gold)}
.vt.big{border-color:var(--loss);color:var(--loss)}
.h1fold td{font-size:15px}
@media (max-width:640px){
  .mtable .who .badge{display:none}.mtable td:first-child{white-space:normal}.mtable .pos{display:block;margin-left:0}
  .mtable td,.mtable th,.h1table td,.h1table th{padding:9px 10px}
  .checker output{flex-basis:100%;white-space:normal}
  .ladder table{min-width:0;width:100%}.ladder td,.ladder th{padding:7px 10px}
}

/* parlays */
.legform{display:flex;flex-wrap:wrap;gap:10px;align-items:end;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:14px 16px}
.legform label{display:grid;gap:5px;font-size:12px;color:var(--muted)}
.legform select,.legform input{font:600 14px var(--sans);background:var(--raised);color:var(--ink);border:1px solid var(--line);border-radius:var(--r-sm);padding:8px 10px;min-width:0}
.legform select{padding-right:30px}
.legform input{width:88px;font:600 16px var(--num)}
.legs{display:grid;gap:8px;margin:14px 0}
.leg{display:grid;grid-template-columns:auto 1fr auto auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:11px 14px}
.leg .num{font:600 14px var(--num);color:var(--on-garnet);background:var(--garnet);width:24px;height:24px;border-radius:50%;display:grid;place-items:center}
.leg b{font:600 17px var(--num);--fs:88%}
.leg .pc{font:600 16px var(--num);color:var(--muted)}
.pmath{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface);overflow:hidden}
.pmath .st strong.gold{color:var(--gold-text)}
.warnline{font-size:13px;color:var(--loss);margin-top:8px}
.xbtn{background:none;border:0;color:var(--faint);cursor:pointer;font-size:18px;padding:0 4px;line-height:1}
.xbtn:hover{color:var(--loss)}

/* bets + record */
dialog.slip{border:1px solid var(--line);border-radius:var(--r-lg);padding:0;background:var(--surface);color:var(--ink);width:min(440px,calc(100vw - 32px));box-shadow:0 30px 80px -20px rgba(0,0,0,.6)}
dialog.slip::backdrop{background:rgba(10,6,8,.6);backdrop-filter:blur(3px)}
dialog.slip[open]{animation:pop .2s ease}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}
.slip-h{background:var(--garnet);color:var(--on-garnet);padding:14px 20px;font:600 18px var(--num);--fs:88%}
.slip-b{padding:18px 20px;display:grid;gap:14px}
.slip-b .what{font:600 22px/1.15 var(--num);--fs:88%}
.slip-b .what small{display:block;font:500 13px var(--sans);color:var(--muted);margin-top:3px}
.slip-f{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.slip-f label{font-size:12px;color:var(--muted);display:grid;gap:5px}
.slip-f input{font:600 17px var(--num);background:var(--raised);color:var(--ink);border:1px solid var(--line);border-radius:var(--r-sm);padding:8px 10px;width:100%}
.slip-f input:focus{border-color:var(--gold);outline:none;box-shadow:0 0 0 3px var(--gold-soft)}
.slip-a{display:flex;justify-content:flex-end;gap:8px;padding:0 20px 18px}
.bets td{font-size:14px}
.res{display:inline-block;min-width:24px;text-align:center;font:700 11.5px/1 var(--sans);padding:4px 7px;border-radius:999px}
.res.W{background:var(--win);color:#06150D}.res.L{background:var(--loss);color:#1D0509}.res.P,.res.V{background:var(--line);color:var(--ink)}.res.O{border:1px solid var(--line);color:var(--muted)}
.setgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;margin:4px 0 10px}
.setgrid label{font-size:12.5px;color:var(--muted);display:grid;gap:5px}
.setgrid input,.setgrid select{font:600 16px var(--num);background:var(--raised);color:var(--ink);border:1px solid var(--line);border-radius:var(--r-sm);padding:8px 10px}
.takeaways{margin:14px 0 0;padding:16px 20px 16px 38px;background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--garnet-hi);border-radius:var(--r-lg);display:grid;gap:8px;font-size:14px}
.takeaways li::marker{color:var(--garnet-text)}
.slip-note{font-size:12.5px}

/* one orchestrated entrance per tab change */
section[role=tabpanel].enter>*{animation:rise .45s cubic-bezier(.2,.8,.2,1) both}
section[role=tabpanel].enter>*:nth-child(2){animation-delay:.04s}
section[role=tabpanel].enter>*:nth-child(3){animation-delay:.08s}
section[role=tabpanel].enter>*:nth-child(n+4){animation-delay:.12s}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.skel{height:14px;border-radius:7px;background:linear-gradient(90deg,var(--surface),var(--raised),var(--surface));background-size:200% 100%;animation:sh 1.2s linear infinite}
@keyframes sh{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}}

/* =====================================================================
   Ventriloc-style layer: light, airy, pill nav, beige feature panels,
   orange for data, brown-gold for small labels
   ===================================================================== */
body{background:var(--ground);background-image:none!important;font-feature-settings:"cv11","ss01";letter-spacing:-.005em}
:root[data-theme="light"] body{background-image:none}
/* top navigation (desktop) */
.app{display:block}
.side{position:sticky;top:0;z-index:30;height:auto;flex-direction:row;align-items:center;justify-content:space-between;gap:18px;padding:14px max(32px,calc((100vw - 1240px)/2 + 32px));border:0;border-bottom:1px solid transparent;background:color-mix(in srgb,var(--ground) 86%,transparent);backdrop-filter:saturate(1.3) blur(14px);-webkit-backdrop-filter:saturate(1.3) blur(14px)}
.brand{padding:0}
.mark{width:32px;height:32px;border-radius:9px;background:var(--gold);box-shadow:none}
.mark svg path{stroke:#fff}
.brand h1{font:600 19px/1 var(--num);letter-spacing:-.02em}
.brand small{font-size:12px}
nav.sidenav{display:flex;gap:2px;background:var(--pill);border-radius:999px;padding:4px}
nav.sidenav button{width:auto;padding:8px 16px;border-radius:999px;font:500 14px var(--sans);color:var(--ink);gap:0}
nav.sidenav button svg{display:none}
nav.sidenav button:hover{background:color-mix(in srgb,var(--surface) 60%,transparent)}
nav.sidenav button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
nav.sidenav button[aria-selected="true"]::before{display:none}
.side-foot{margin:0;display:flex;align-items:center;gap:14px;padding:0;border:0}
.themebtn{background:var(--garnet);color:var(--on-garnet);border-color:var(--garnet);padding:8px 14px}
.themebtn svg{stroke:currentColor}

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const n = (v, d = 1) => v == null || isNaN(v) ? "–" : Number(v).toFixed(d);
const sgn = (v, d = 1) => v == null || isNaN(v) ? "–" : (v > 0 ? "+" : "") + Number(v).toFixed(d);
const units = u => u == null ? "–" : `${u >= 0 ? "+" : ""}${Number(u).toFixed(2)}u`;
const uc = u => u == null ? "" : (u >= 0 ? "up" : "down");
const when = iso => iso ? new Date(iso).toLocaleString([], {weekday: "short", hour: "numeric", minute: "2-digit"}) : "";
const day = iso => iso ? new Date(iso).toLocaleDateString([], {weekday: "short", month: "short", day: "numeric"}) : "";
const ico = id => `<svg><use href="#i-${id}"/></svg>`;
const fmtO = o => o == null ? "–" : (+o > 0 ? "+" : "") + Math.round(+o);
const PK_NAME = {"1x2": "Moneyline", dnb: "Draw no bet", ah: "Asian handicap", total: "Total goals", btts: "Both teams to score"};
const PSTAT = {goal: "Anytime goal", sot1: "1+ shot on target", sot2: "2+ shots on target"};
let D = null, LG = "all";

/* ---------- tabs, theme ---------- */
function showTab(tab, push = true) {
  document.querySelectorAll("nav button[data-tab]").forEach(x => x.setAttribute("aria-selected", x.dataset.tab === tab));
  document.querySelectorAll("[role=tabpanel]").forEach(s => { s.hidden = s.id !== tab; s.classList.remove("enter"); });
  const sec = document.getElementById(tab); if (sec) { void sec.offsetWidth; sec.classList.add("enter"); }
  if (push) history.replaceState(null, "", "#tab-" + tab);
  window.scrollTo({top: 0});
}
document.querySelectorAll("nav button[data-tab]").forEach(b => b.addEventListener("click", () => showTab(b.dataset.tab)));
function tabFromHash() { const t = location.hash.replace("#tab-", ""); if (t && document.getElementById(t)?.getAttribute("role") === "tabpanel") showTab(t, false); }
tabFromHash(); window.addEventListener("hashchange", tabFromHash);
function syncThemeBtn() {
  const light = document.documentElement.dataset.theme === "light";
  ["themeBtn", "themeBtnM"].forEach(id => { const b = document.getElementById(id); if (!b) return;
    b.querySelector("use").setAttribute("href", light ? "#i-moon" : "#i-sun");
    const sp = b.querySelector("span"); if (sp) sp.textContent = light ? "Dark mode" : "Light mode"; });
}
["themeBtn", "themeBtnM"].forEach(id => { const b = document.getElementById(id); if (b) b.onclick = () => {
  const light = document.documentElement.dataset.theme !== "light";
  if (light) document.documentElement.dataset.theme = "light"; else delete document.documentElement.dataset.theme;
  try { localStorage.setItem("board.theme", light ? "light" : "dark"); } catch (e) {}
  syncThemeBtn(); }; });
syncThemeBtn();
document.addEventListener("click", e => { const s = e.target.closest(".sub"); if (s && !e.target.closest("a,button,input,select")) s.classList.toggle("open"); });
document.addEventListener("click", e => { const b = e.target.closest("[data-go]"); if (b) { e.preventDefault(); showTab(b.dataset.go); } });
document.addEventListener("click", e => { const b = e.target.closest("[data-lg]"); if (b) { LG = b.dataset.lg; try { localStorage.setItem("board.soccer.lg", LG); } catch (x) {} render(); } });
document.addEventListener("click", e => { const t = e.target.closest("[data-game]"); if (!t) return; showTab("games"); const el = document.getElementById("g-" + t.dataset.game); if (el) { el.open = true; el.scrollIntoView({block: "start"}); } });

/* ---------- bankroll, bets (bankroll shared with the other pages) ---------- */
const LS_SET = "board.settings.v1", LS_BETS = "board.soccer.bets.v1", LS_LINES = "board.soccer.lines.v1";
const lsGet = (k, d) => { try { const v = JSON.parse(localStorage.getItem(k)); return v ?? d; } catch (e) { return d; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
try { LG = localStorage.getItem("board.soccer.lg") || "all"; } catch (e) {}
let SET = {bankroll: 1000, unit: 10, kelly: 0.25, maxpct: 3, ...lsGet(LS_SET, {})};
let BETS = lsGet(LS_BETS, []), MYLINES = lsGet(LS_LINES, {});
let RES = null;
const oddsNum = o => +String(o ?? "").replace("+", "");
const payout = o => { o = oddsNum(o); return o > 0 ? o / 100 : 100 / -o; };
const impl = o => { o = oddsNum(o); return o > 0 ? 100 / (o + 100) : -o / (-o + 100); };
const fair = p => { if (!(p > 0 && p < 1)) return "–"; const a = p >= .5 ? -Math.round(100 * p / (1 - p)) : Math.round(100 * (1 - p) / p); return a > 0 ? "+" + a : String(a); };
function sizing(pPct, odds) {
  const p = (pPct ?? NaN) / 100, b = payout(odds || -110);
  if (!isFinite(p) || !isFinite(b) || b <= 0) return null;
  const f = (b * p - (1 - p)) / b;
  if (f <= 0) return {units: 0, dollars: 0};
  const pct = Math.min(f * SET.kelly * 100, SET.maxpct), dollars = SET.bankroll * pct / 100;
  return {units: Math.round(dollars / Math.max(SET.unit, 0.01) * 10) / 10, dollars: Math.round(dollars)};
}
const stakeTxt = (pPct, odds) => { const z = sizing(pPct, odds); if (!z) return ""; return z.units > 0 ? `Suggested bet <b>${z.units}u</b> ($${z.dollars})` : `Suggested bet <b>none</b> at this price`; };
const betKey = b => [b.kind, b.game_id, b.pid || "", b.stat || "", b.side, b.line ?? ""].join("|");
const hasBet = b => BETS.some(x => betKey(x) === betKey(b));
const PENDING = {};
function logBtn(b) { const id = "b" + Math.random().toString(36).slice(2, 9); PENDING[id] = b;
  return hasBet(b) ? `<button class="logbtn done" disabled>Logged</button>` : `<button class="logbtn" data-log="${id}">I bet this</button>`; }
let SLIP = null;
document.addEventListener("click", ev => { const btn = ev.target.closest("[data-log]"); if (!btn) return; ev.preventDefault(); ev.stopPropagation(); openSlip(PENDING[btn.dataset.log]); });
function openSlip(b) {
  SLIP = b; const z = sizing(b.model_pct, b.odds);
  $("#slipWhat").innerHTML = `${esc(b.desc)}<small>${esc(b.sub || "")}</small>`;
  $("#slipLine").value = b.line ?? ""; $("#slipLine").disabled = b.line == null;
  $("#slipOdds").value = b.odds || "-110"; $("#slipUnits").value = z && z.units > 0 ? z.units : 1;
  const note = () => { $("#slipNote").innerHTML = b.model_pct != null ? `Model chance ${n(b.model_pct, 0)}%. ${stakeTxt(b.model_pct, $("#slipOdds").value)}. 1 unit = $${SET.unit}.` : `1 unit = $${SET.unit}.`; };
  note(); $("#slipOdds").oninput = note; $("#slip").showModal();
}
$("#slipCancel").onclick = () => $("#slip").close();
$("#slipSave").onclick = () => {
  const b = SLIP; if (!b) return;
  const odds = $("#slipOdds").value.trim() || "-110", u = +$("#slipUnits").value || 1;
  if (!isFinite(payout(odds)) || Math.abs(oddsNum(odds)) < 100) { $("#slipNote").textContent = "Use American odds like -110 or +150."; return; }
  BETS.push({...b, line: b.line == null ? null : +$("#slipLine").value, odds, units: u, id: Date.now().toString(36), placed: new Date().toISOString()});
  lsSet(LS_BETS, BETS); $("#slip").close(); render(); };
function splitLine(L) { return Math.round(L * 4) % 2 ? [L - 0.25, L + 0.25] : [L]; }
function gradeBet(b) {
  const g = RES?.[String(b.game_id)]; if (!g) return {res: "O"};
  const pay = payout(b.odds);
  const halves = vs => { const parts = vs.map(v => v > 0 ? pay : v < 0 ? -1 : 0), u = parts.reduce((s, x) => s + x, 0) / parts.length;
    return {res: u > 0 ? "W" : u < 0 ? "L" : "P", units: b.units * u}; };
  if (b.kind === "1x2") { const y = g.hg > g.ag ? "home" : g.hg === g.ag ? "draw" : "away"; const w = b.who === y; return {res: w ? "W" : "L", units: w ? b.units * pay : -b.units}; }
  if (b.kind === "dnb") { if (g.hg === g.ag) return {res: "P", units: 0}; const w = (g.hg > g.ag) === (b.who === "home"); return {res: w ? "W" : "L", units: w ? b.units * pay : -b.units}; }
  if (b.kind === "btts") { const yes = g.hg > 0 && g.ag > 0, w = yes === (b.side === "Yes"); return {res: w ? "W" : "L", units: w ? b.units * pay : -b.units}; }
  if (b.kind === "ah") { const m = b.who === "home" ? g.hg - g.ag : g.ag - g.hg; return halves(splitLine(b.line).map(L => m + L)); }
  if (b.kind === "total") { const t = g.hg + g.ag; return halves(splitLine(b.line).map(L => (t - L) * (b.side === "Over" ? 1 : -1))); }
  if (b.kind === "prop") { const st = g.p?.[String(b.pid)]; if (!g.p) return {res: "O"}; if (!st) return {res: "V", units: 0};
    const v = b.stat === "goal" ? st[0] : st[1], need = b.stat === "sot2" ? 2 : 1, w = (v >= need) === (b.side !== "No");
    return {res: w ? "W" : "L", units: w ? b.units * pay : -b.units}; }
  return {res: "O"};
}

/* ---------- shared bits ---------- */
const lgOk = x => LG === "all" || x.league === LG;
const lgName = k => D.leagues?.[k]?.short || k;
const lgChips = () => `<div class="lgchips">${[["all", "All leagues"], ...Object.entries(D.leagues || {}).map(([k, v]) => [k, v.name])].map(([k, v]) => `<button data-lg="${k}" aria-pressed="${LG === k}">${esc(v)}</button>`).join("")}</div>`;
function meterHTML(model, book) {
  if (model == null || book == null) return "";
  const m = Math.max(0, Math.min(100, +model)), b = Math.max(0, Math.min(100, +book)), gap = m - b;
  return `<div class="meter"><span class="m-track"><i class="m-fill" style="width:${m}%"></i>${gap > 0 ? `<i class="m-gap" style="left:${b}%;width:${gap}%"></i>` : ""}<i class="m-book" style="left:${b}%"></i></span>
    <span class="m-lab"><b>${n(m, 0)}%</b> model vs ${n(b, 0)}% book</span></div>`;
}
const threeWay = g => `<div class="tw" role="img" aria-label="Home ${n(g.p_home, 0)}%, draw ${n(g.p_draw, 0)}%, away ${n(g.p_away, 0)}%"><i class="h" style="width:${g.p_home}%"></i><i class="d" style="width:${g.p_draw}%"></i><i class="a" style="width:${g.p_away}%"></i></div>
  <div class="twl"><span>${esc(g.home)} ${n(g.p_home, 0)}%</span><span>Draw ${n(g.p_draw, 0)}%</span><span>${esc(g.away)} ${n(g.p_away, 0)}%</span></div>`;
function sparkSVG(series) {
  if (!series.length) return `<div class="pmuted">The trend line starts after the first graded matchday.</div>`;
  const W = 320, H = 120, pad = 8, pts = [0, ...series.map(s => s.units)], lo = Math.min(0, ...pts), hi = Math.max(0, ...pts), span = Math.max(hi - lo, 1);
  const x = i => pad + i * (W - 2 * pad) / Math.max(pts.length - 1, 1), y = v => H - 18 - (v - lo) / span * (H - 34);
  const d = pts.map((v, i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(" ");
  const area = d + ` L${x(pts.length - 1).toFixed(1)},${y(lo).toFixed(1)} L${x(0).toFixed(1)},${y(lo).toFixed(1)} Z`;
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Cumulative units">
    <line class="zero" x1="${pad}" x2="${W - pad}" y1="${y(0)}" y2="${y(0)}"/><path class="area" d="${area}"/><path class="lineup" d="${d}"/>
    <circle cx="${x(pts.length - 1)}" cy="${y(pts[pts.length - 1])}" r="4" fill="var(--gold)"/>
    <text x="${W - pad}" y="${H - 3}" text-anchor="end">${esc(series[series.length - 1].date.slice(5))}</text></svg>`;
}
function pickText(k, p) {

  if (k === "ah") return `${p.side} ${p.line > 0 ? "+" : ""}${p.line}`;
  if (k === "total") return `${p.side} ${p.line}`;

}
const whoOf = (g, side) => side === g.home ? "home" : side === g.away ? "away" : "draw";
function allPlays() {

  return out.sort((a, b) => b.edge - a.edge);
}
const playBet = x => ({kind: x.kind, game_id: x.g.game_id, who: x.kind === "1x2" ? x.p.who : whoOf(x.g, x.p.side), side: x.p.side,

}

        <td class="c-st">${n(100 * p.p_start, 0)}%</td><td>${n(pr, 0)}%</td><td class="fair">${fair(pr / 100)}</td>
        <td>${j ? `<span class="${j.tier === "play" ? "gold" : "dim"}" style="font-weight:600">${esc(my.odds)}, ${sgn(j.ev, 0)}%</span>` : `<span class="dim">enter</span>`}</td></tr>
        ${PU.open === key ? `<tr class="detail"><td colspan="5">${checker(p, key, pr)}</td></tr>` : ""}`; }).join("")}</tbody></table></div>
    ${rows.length > 80 && !PU.all ? `<button class="more" id="puAll">Show all ${rows.length}</button>` : ""}
    ${rows.length ? "" : `<div class="empty">No players for this filter yet.</div>`}
    <p class="note">Starts = how often he started his team's last 6 matches (recent ones count more). Lineups come out about an hour before kickoff: a player who isn't starting is a much worse bet than these numbers show.</p>`;
  $("#props").innerHTML = h;
  document.querySelectorAll("[data-stat]").forEach(b => b.onclick = () => { PU.stat = b.dataset.stat; PU.open = null; renderProps(); });
  $("#puGame").onchange = e => { PU.game = e.target.value; renderProps(); };
  $("#puQ").oninput = e => { PU.q = e.target.value; clearTimeout(PU.t); PU.t = setTimeout(() => { renderProps(); const el = $("#puQ"); el.focus(); el.setSelectionRange(el.value.length, el.value.length); }, 250); };
  const all = $("#puAll"); if (all) all.onclick = () => { PU.all = true; renderProps(); };
  document.querySelectorAll("tr[data-open]").forEach(r => r.onclick = e => { if (e.target.closest("input,button,select")) return; PU.open = PU.open === r.dataset.open ? null : r.dataset.open; renderProps(); });
  document.querySelectorAll(".checker[data-key]").forEach(c => { const inp = c.querySelector(".od");
    inp.onchange = () => { MYLINES[c.dataset.key] = {odds: inp.value.trim()}; lsSet(LS_LINES, MYLINES); renderProps(); }; });
}
function checker(p, key, pr) {
  const my = MYLINES[key] || {odds: ""}, j = my.odds ? judge(pr, my.odds) : null;
  const ge = PU.stat === "goal" ? p.m.goal.ge : p.m.sot.ge, lab = PU.stat === "goal" ? "goals" : "shots on target";
  return `<div class="ladder"><table><thead><tr><th>${PU.stat === "goal" ? "Goals" : "Shots on target"}</th><th>Chance</th><th>Fair</th></tr></thead><tbody>
    ${[1, 2, 3].map(k => `<tr class="${(PU.stat === "sot2" ? 2 : 1) === k ? "fairrow" : ""}"><td>${k}+ ${lab}</td><td>${n(100 * ge[k], 0)}%</td><td>${fair(ge[k])}</td></tr>`).join("")}</tbody></table>
    <div class="checker" data-key="${key}"><span class="fld">Your book's odds <input class="odds od" value="${esc(my.odds)}" placeholder="+250" inputmode="decimal"></span>
      <output>${j ? verdictTxt(j) : "Type the price for " + esc(PSTAT[PU.stat].toLowerCase())}</output></div>
    <div class="logrow">${logBtn({kind: "prop", game_id: p.game_id, pid: p.pid, stat: PU.stat, side: "Yes", line: null, odds: my.odds || fair(pr / 100), model_pct: pr,
      desc: `${p.name} ${PSTAT[PU.stat]}`, sub: `${p.team} vs ${p.opp}`})}</div></div>`;
}

/* ---------- teams ---------- */
const TS = {key: "net"};
function renderTeams() {
  const lgs = Object.keys(D.leagues || {}).filter(k => LG === "all" || k === LG);
  let h = lgChips() + `<div class="sec-head"><h2>Team ratings</h2><span class="aside">Goals per match vs an average side, neutral ground</span></div>
    <p class="sub">Attack is the goals a club would score against an average defence, defence is the goals it would allow against an average attack. Built on xG where it's free (Premier League, La Liga) and shots on target elsewhere, blended with real goals, recent matches counting most. Newly promoted clubs start below average until their own matches take over.</p>`;
  for (const k of lgs) {
    const T = (D.teams || []).filter(t => t.league === k).sort((a, b) => TS.key === "def" ? a.def - b.def : b[TS.key] - a[TS.key]);
    const m = D.model?.[k] || {};
    h += `<h3>${esc(D.leagues[k].name)} <span class="dim" style="font-weight:400;font-size:13px">home edge ${n(100 * (Math.exp(m.home || 0) - 1), 0)}% more goals</span></h3>
      <div class="tablewrap"><table><thead><tr><th>#</th><th style="text-align:left">Team</th>${[["net", "Net"], ["att", "Attack"], ["def", "Defence"]].map(([c, l]) => `<th class="sort${TS.key === c ? " sorted" : ""}" data-ts="${c}">${l}</th>`).join("")}</tr></thead><tbody>
      ${T.map((t, i) => `<tr><td>${i + 1}</td><td style="text-align:left">${esc(t.team)}${t.new ? ` <span class="lgtag">${t.new === "down" ? "relegated" : "promoted"}</span>` : ""}</td><td class="${t.net >= 0 ? "up" : "down"}">${sgn(t.net, 2)}</td><td>${n(t.att, 2)}</td><td>${n(t.def, 2)}</td></tr>`).join("")}</tbody></table></div>`;
  }
  $("#teams").innerHTML = h;
  document.querySelectorAll("[data-ts]").forEach(th => th.onclick = () => { TS.key = th.dataset.ts; renderTeams(); });
}

/* ---------- record ---------- */
function renderRecord() {
  const T = D.tracking || {}, P = T.plays || {}, BT = T.by_type || {}, BL = T.by_league || {}, K = T.picks || {}, bt = D.backtest || {};
  let h = `<div class="sec-head"><h2>Plays record</h2><span class="aside">Graded automatically, flat 1 unit</span></div>
    <p class="sub">Every play is locked at kickoff and graded from the final score.</p>
    <div class="strip"><div class="st"><strong>${P.w || 0}–${P.l || 0}</strong><span>Match plays, ${n(P.pct)}%</span></div>
      <div class="st"><strong class="${P.w + P.l ? uc(P.units) : ""}">${P.w + P.l ? units(P.units) : "–"}</strong><span>Units (ROI ${n(P.roi)}%)</span></div></div>
    <div class="tablewrap" style="margin-top:12px"><table class="rtype"><thead><tr><th>Bet type</th><th>Record</th><th>Hit</th><th>Units</th></tr></thead><tbody>
      <tr class="grp"><td colspan="4">By bet type</td></tr>${["1x2", "ah", "total"].map(k => recRow("kid", PK_NAME[k], BT[k])).join("")}
      <tr class="grp"><td colspan="4">By league</td></tr>${Object.keys(D.leagues).map(k => recRow("kid", esc(D.leagues[k].name), BL[k])).join("")}
      ${recRow("all", "All plays", P)}</tbody></table></div>`;
  h += `<h3>Every pick, every match</h3><p class="sub">The model's lean on every match, play or not. Units only where a book price was posted.</p>
    <div class="strip">${["1x2", "ah", "total", "dnb", "btts"].map(k => `<div class="st"><strong>${K[k]?.w || 0}–${K[k]?.l || 0}</strong><span>${PK_NAME[k]}${K[k]?.units != null ? `, ${units(K[k].units)} where priced` : ""}</span></div>`).join("")}</div>`;
  const C = Object.entries(T.calibration || {});
  h += `<h3>Prop check</h3><p class="sub">How often players hit vs what the model said, for players who played.</p>
    ${C.length ? `<div class="tablewrap"><table><thead><tr><th>Prop</th><th>Graded</th><th>Model said</th><th>Actually hit</th></tr></thead><tbody>${C.map(([k, c]) => `<tr><td>${esc(PSTAT[k] || k)}</td><td>${c.n}</td><td>${n(c.model)}%</td><td>${n(c.actual)}%</td></tr>`).join("")}</tbody></table></div>` : `<div class="empty">Nothing graded yet. Results appear the morning after each matchday.</div>`}`;
  const L = (T.plays_list || []).filter(lgOk);
  if (L.length) h += `<h3>Recent plays</h3><div class="tablewrap"><table><thead><tr><th>Date</th><th>Play</th><th>Odds</th><th>Score</th><th>Result</th></tr></thead><tbody>${L.map(x => `<tr><td>${x.date.slice(5)}</td><td style="text-align:left"><span class="lgtag">${esc(lgName(x.league))}</span>${esc(x.pick)} <span class="dim">${esc(x.game)}</span></td><td>${esc(x.odds || "")}</td><td>${esc(x.score)}</td><td><span class="res ${x.res.slice(-1)}">${x.res}</span></td></tr>`).join("")}</tbody></table></div>`;
  const lgs = Object.keys(D.leagues || {});
  h += `<h3>Backtest, ${esc(bt.seasons || "last 3 seasons")}</h3><p class="sub">Every Monday the ratings were refit on earlier matches only and the coming week was priced, then compared with the closing line (Pinnacle, the sharpest book). Lower log loss is better. Plays were tested at early Bet365 prices, the kind of price a bettor actually gets.</p>
    <div class="tablewrap"><table><thead><tr><th>League</th><th>Matches</th><th>Model</th><th>Closing line</th><th>Moneyline plays</th><th>AH plays</th><th>Totals plays</th></tr></thead><tbody>
    ${lgs.map(k => { const b = bt[k]; if (!b) return ""; const ml = [b.home, b.away].filter(Boolean), mn = ml.reduce((s, x) => s + (x.n || 0), 0), mu = ml.reduce((s, x) => s + (x.units || 0), 0);
      const tt = [b.over, b.under].filter(Boolean), tn = tt.reduce((s, x) => s + (x.n || 0), 0), tu = tt.reduce((s, x) => s + (x.units || 0), 0);
      const cell = (nn, u) => nn ? `<span class="${uc(u)}">${units(u)}</span> <span class="dim">${nn} bets</span>` : "–";
      return `<tr><td style="text-align:left">${esc(D.leagues[k].name)}</td><td>${b.n}</td><td>${n(b.ll_model, 3)}</td><td>${n(b.ll_close, 3)}</td><td>${cell(mn, mu)}</td><td>${cell(b.ah?.n, b.ah?.units)}</td><td>${cell(tn, tu)}</td></tr>`; }).join("")}</tbody></table></div>
    <p class="note">${esc(bt.note || "")}</p>`;
  const graded = BETS.map(b => ({b, g: gradeBet(b)}));
  const done = graded.filter(x => ["W", "L", "P"].includes(x.g.res)), mw = done.filter(x => x.g.res === "W").length, ml = done.filter(x => x.g.res === "L").length;
  const mu = done.reduce((s, x) => s + (x.g.units || 0), 0);
  h += `<div class="sec-head"><h2>My bets</h2><span class="aside">Saved on this device</span></div>
    <div class="strip"><div class="st"><strong>${mw}–${ml}</strong><span>Record</span></div><div class="st"><strong class="${uc(mu)}">${done.length ? units(mu) : "–"}</strong><span>Units</span></div></div>
    ${graded.length ? `<div class="tablewrap" style="margin-top:10px"><table class="bets"><thead><tr><th>Bet</th><th>Odds</th><th>Units</th><th>Result</th><th></th></tr></thead><tbody>${graded.slice().reverse().map(({b, g}) => `<tr><td style="text-align:left">${esc(b.desc)} <span class="dim">${esc(b.sub || "")}</span></td><td>${esc(b.odds)}</td><td>${n(b.units)}</td><td><span class="res ${g.res}">${g.res === "O" ? "Open" : g.res}</span> ${g.units != null && g.res !== "O" ? units(g.units) : ""}</td><td><button class="xbtn" data-del="${esc(b.id)}" aria-label="Delete">×</button></td></tr>`).join("")}</tbody></table></div>`
      : `<div class="empty">Tap "I bet this" on any market or prop to track it here.</div>`}`;
  $("#record").innerHTML = h;
  document.querySelectorAll("[data-del]").forEach(b => b.onclick = () => { BETS = BETS.filter(x => x.id !== b.dataset.del); lsSet(LS_BETS, BETS); renderRecord(); });
}

function render() { renderHome(); renderGames(); renderProps(); renderTeams(); renderRecord(); }
function freshness() {
  const t = new Date(D.generated_at), mins = Math.round((Date.now() - t) / 6e4);
  const txt = mins < 60 ? `Updated ${mins}m ago` : mins < 1440 ? `Updated ${Math.round(mins / 60)}h ago` : `Updated ${t.toLocaleDateString()}`;
  ["freshTxt", "freshTxtM"].forEach(id => { const e = document.getElementById(id); if (e) e.textContent = txt; });
  $("#sub").textContent = "Soccer model";
}
Promise.all([fetch("data/latest.json", {cache: "no-store"}).then(r => r.json()), fetch("data/results.json", {cache: "no-store"}).then(r => r.ok ? r.json() : {}).catch(() => ({}))])
  .then(([d, res]) => { D = d; RES = res; if (LG !== "all" && !D.leagues?.[LG]) LG = "all"; freshness(); render(); })
  .catch(e => { $("#home").innerHTML = `<div class="empty">Couldn't load the model data (${esc(e.message)}). It appears after the first run.</div>`; });
</script>
</body>
</html>
