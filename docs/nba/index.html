function altCheck(g, key = "alt_parlay") {
  const a = g[key], ak = key === "alt_parlay" ? String(g.game_id) : `${g.game_id}:mix`, odds = ALT[ak] || "";
  let out = `<span class="fld" style="display:inline-flex;align-items:center;gap:7px;font-size:13px">DK odds or ¢ <input class="odds altodds" data-g="${ak}" value="${esc(odds)}" placeholder="+110" style="width:80px;font:600 15px var(--num);border:1px solid var(--line);border-radius:999px;padding:6px 12px;background:var(--surface);color:var(--ink)"></span>`;
  if (odds && Math.abs(oddsNum(odds)) >= 100) {
    const cut = a.cushion != null ? 100 * a.cushion : 5, ev = (a.p / 100 * (payout(odds) + 1) - 1) * 100, tier = ev > 30 ? "big" : ev >= cut ? "play" : ev >= 0 ? "watch" : "none";
    out += `<span class="vt ${tier === "play" ? "play" : tier === "big" ? "big" : ""}">${{play: "Play", watch: "Thin edge", big: "Too big to trust", none: "No play"}[tier]}</span><span class="stake">${sgn(ev)}% expected return</span>`;
    if (tier === "play" || tier === "watch") out += logBtn({kind: "parlay", game_id: g.game_id, side: "", line: null, odds, model_pct: a.p,
      legs: a.legs.map(L => L.kind === "team" ? {kind: "team", market: L.market, team: L.team, side: L.side, line: L.line} : {pid: L.pid, stat: L.stat, line: L.line}),
      desc: `${a.legs.length}-leg alt parlay`, sub: a.legs.map(L => `${L.name ? L.name + " " : ""}${L.label}`).join(" + ")});
  }
  return out;
}

/* ---------- teams ---------- */
const TS = {sort: "net", dir: -1};
function renderTeams() {
  const rows = (D.teams || []).map(t => ({...t, diff: t.pf != null ? t.pf - t.pa : null, gp: (t.w || 0) + (t.l || 0)}));
  rows.sort((a, b) => TS.dir * ((a[TS.sort] ?? -99) - (b[TS.sort] ?? -99)));
  const rk = {}; [...rows].sort((a, b) => (b.net ?? -99) - (a.net ?? -99)).forEach((t, i) => rk[t.team] = i + 1);
  const sg = (v, d = 1) => v == null ? "–" : (v > 0 ? "+" : "") + n(v, d);
  const col = (k, lab) => `<th class="sort ${TS.sort === k ? "sorted" : ""}" data-sort="${k}">${lab}</th>`;
  $("#teams").innerHTML = `<h2>Power rankings</h2><p class="sub"><b>Net</b> is the model's own grade: expected point margin per game against a league-average team on a neutral floor, adjusted for who each team played. <b>Offense</b> is points scored above average, <b>Defense</b> is points kept off the board (above 0 is good for both). Newer games count more, and early in the season last year's games still carry weight.</p>
    <div class="tablewrap"><table><thead><tr><th>#</th><th>Team</th>${col("net", "Net")}${col("off", "Offense")}${col("def", "Defense")}${col("w", "W")}${col("l", "L")}${col("pf", "Points for")}${col("pa", "Points against")}${col("diff", "Margin")}</tr></thead><tbody>
    ${rows.map(t => `<tr><td>${rk[t.team]}</td><td><div style="display:flex;align-items:center;gap:9px">${badge(t.team)}</div></td><td><b>${sg(t.net)}</b></td><td>${sg(t.off)}</td><td>${sg(t.def)}</td><td>${t.w}</td><td>${t.l}</td><td>${n(t.pf, 1)}</td><td>${n(t.pa, 1)}</td><td>${sg(t.diff)}</td></tr>`).join("")}</tbody></table></div>`;
  document.querySelectorAll("#teams th[data-sort]").forEach(th => th.onclick = () => { const k = th.dataset.sort; TS.dir = TS.sort === k ? -TS.dir : (k === "pa" || k === "l" ? 1 : -1); TS.sort = k; renderTeams(); });
}

/* ---------- record ---------- */
function renderRecord() {
  const T = D.tracking || {}, P = T.plays || {}, PP = T.prop_plays || {}, K = T.picks || {};
  const graded = BETS.map(b => ({b, g: gradeBet(b)}));
  const done = graded.filter(x => ["W", "L", "P"].includes(x.g.res)), mw = done.filter(x => x.g.res === "W").length, ml = done.filter(x => x.g.res === "L").length;
  const mu = done.reduce((s, x) => s + (x.g.units || 0), 0), risked = done.reduce((s, x) => s + (x.b.units || 0), 0);
  let h = `<div class="sec-head"><h2>Plays record</h2><span class="aside">Graded automatically, flat 1 unit</span></div>
    <p class="sub">Every play the model posts is locked when it appears and graded from the final box score. Break-even depends on the price, about 52% at -110.</p>
    <div class="strip"><div class="st"><strong>${P.w || 0}–${P.l || 0}</strong><span>Game plays, ${n(P.pct)}%</span></div>
      <div class="st"><strong class="${uc(P.units)}">${units(P.units)}</strong><span>Game plays, units</span></div>
      <div class="st"><strong>${PP.w || 0}–${PP.l || 0}</strong><span>Prop plays, ${n(PP.pct)}%</span></div>
      <div class="st"><strong class="${uc(PP.units)}">${units(PP.units)}</strong><span>Prop plays, units (ROI ${n(PP.roi)}%)</span></div></div>`;
  h += clvBlock() + calBlock() + propClvHTML() + gatesHTML();
  h += `<h3>Every pick, every game</h3><div class="strip">${["ml", "spread", "total"].map(k => `<div class="st"><strong>${K[k]?.w || 0}–${K[k]?.l || 0}</strong><span>${PK_NAME[k]} picks${K[k]?.units != null ? `, ${units(K[k].units)} where priced` : ""}</span></div>`).join("")}</div>`;
  const C = Object.entries(T.calibration || {});
  h += `<h3>Model vs reality, props</h3><p class="sub">At the model's fair line, overs should hit about as often as the model says. A big gap means a market runs high or low.</p>
    ${C.length ? `<div class="tablewrap"><table><thead><tr><th>Stat</th><th>Graded</th><th>Model said over</th><th>Actually over</th></tr></thead><tbody>${C.map(([k, c]) => `<tr><td>${STAT[k]}</td><td>${c.n}</td><td>${n(c.model)}%</td><td class="${c.n >= 100 && Math.abs(c.actual - c.model) > 4 ? (c.actual > c.model ? "up" : "down") : ""}">${n(c.actual)}%</td></tr>`).join("")}</tbody></table></div>` : `<div class="empty">Nothing graded yet. Results appear the morning after each game.</div>`}`;
  const E = T.edge || {};
  h += `<h3>Edge parlays</h3>` + ((E.w || E.l) ? `<div class="strip"><div class="st"><strong>${E.w}–${E.l}</strong><span>Hit ${n(E.pct)}% (model said ${n(E.model)}%)</span></div><div class="st"><strong class="${uc(E.units)}">${units(E.units)}</strong><span>Units at feed odds (ROI ${n(E.roi)}%)</span></div></div>
    <div class="tablewrap" style="margin-top:10px"><table><thead><tr><th>Date</th><th>Legs</th><th>Odds</th><th>Result</th></tr></thead><tbody>${E.recent.map(x => `<tr><td>${x.date.slice(5)}</td><td>${esc(x.legs)}</td><td>${esc(x.odds)}</td><td><span class="res ${x.res}">${x.res}</span></td></tr>`).join("")}</tbody></table></div>`
    : `<div class="empty">Nothing graded yet. Started Oct 15.</div>`);
  const A = T.alt || {}, AO = T.alt_old || {}, AH = T.alt_hr || {};
  h += `<h3>Same-game parlays</h3><p class="sub">Current version (since Oct 18): fair +100 to +125, legs corrected by type from graded games, most likely ticket.</p>`;
  if (AO.n) h += `<p class="sub">First version (fair +100 to +125, with filler legs): ${AO.hits}–${AO.n - AO.hits}, hit ${n(100 * AO.hits / AO.n)}% when the model said ${n(AO.model)}%. Retired Oct 15.</p>`;
  if (AH.n) h += `<p class="sub">Hit-rate version (fair −150 to −260, 80%+ legs): ${AH.hits}–${AH.n - AH.hits}, hit ${n(100 * AH.hits / AH.n)}% when the model said ${n(AH.model)}%. Oct 15 to 18.</p>`;
  if (!A.n) h += `<div class="empty">Current version: nothing graded yet. Started Oct 18.</div>`;
  const AX = T.alt_mix || {};
  h += `<p class="sub">Tickets with a team leg (since Oct 21): ${AX.n ? `${AX.hits}–${AX.n - AX.hits}, hit ${n(100 * AX.hits / AX.n)}% when the model said ${n(AX.model)}%.` : "nothing graded yet."}</p>`;
  if (A.n) h += `<div class="strip"><div class="st"><strong>${A.hits}–${A.n - A.hits}</strong><span>Hit ${n(100 * A.hits / A.n)}% (model said ${n(A.model)}%)</span></div></div>
    <div class="tablewrap" style="margin-top:10px"><table><thead><tr><th>Date</th><th>Game</th><th>Legs hit</th><th>Result</th></tr></thead><tbody>${A.recent.map(x => `<tr><td>${x.date.slice(5)}</td><td>${esc(x.game)}</td><td>${x.legs_hit} of ${x.legs}</td><td><span class="res ${x.hit ? "W" : "L"}">${x.hit ? "Hit" : "Miss"}</span></td></tr>`).join("")}</tbody></table></div>`;
  const L = [...(T.plays_list || []).map(x => ({...x, what: x.pick, who: x.game})), ...(T.alt_plays_list || []).map(x => ({...x, what: x.pick, who: x.game})), ...(T.prop_plays_list || []).map(x => ({...x, what: x.pick, who: x.player}))].sort((a, b) => b.date.localeCompare(a.date)).slice(0, 40);
  if (L.length) h += `<h3>Recent plays</h3><div class="tablewrap"><table><thead><tr><th>Date</th><th>Play</th><th>Odds</th><th>Gap</th><th>vs close</th><th>Result</th></tr></thead><tbody>${L.map(x => `<tr><td>${x.date.slice(5)}</td><td>${esc(x.who)} <span class="dim">${esc(x.what)}</span></td><td>${esc(x.odds || "")}</td><td>${n(x.edge)}%</td><td class="${x.clv > 0 ? "up" : x.clv < 0 ? "down" : ""}">${x.clv == null ? "–" : sgn(x.clv)}</td><td><span class="res ${x.res}">${x.res}</span></td></tr>`).join("")}</tbody></table></div>`;
  h += `<div class="sec-head"><h2>My bets</h2><span class="aside">Saved on this device</span></div>
    <div class="strip"><div class="st"><strong>${mw}–${ml}</strong><span>Record</span></div><div class="st"><strong class="${uc(mu)}">${done.length ? units(mu) : "–"}</strong><span>Units</span></div>
      <div class="st"><strong>${risked ? n(100 * mu / risked) + "%" : "–"}</strong><span>Return on money risked</span></div></div>
    ${graded.length ? `<div class="tablewrap" style="margin-top:10px"><table class="bets"><thead><tr><th>Bet</th><th>Odds</th><th>Units</th><th>Result</th><th></th></tr></thead><tbody>${graded.slice().reverse().map(({b, g}) => `<tr><td>${esc(b.desc)} <span class="dim">${esc(b.sub || "")}</span></td><td>${esc(b.odds)}</td><td>${n(b.units)}</td><td><span class="res ${g.res}">${g.res === "O" ? "Open" : g.res}</span> ${g.units != null && g.res !== "O" ? units(g.units) : ""}</td><td><button class="xbtn" data-del="${esc(b.id)}" aria-label="Delete">×</button></td></tr>`).join("")}</tbody></table></div>`
      : `<div class="empty" style="margin-top:10px"><b>No bets logged yet.</b> Tap <b>I bet this</b> on any play.</div>`}
    <div class="sec-head"><h2>About the model</h2></div>
    <p class="sub">Team strength is an offense and defense rating for every team from every final score (newer games count more, last season's count less), adjusted for opponents, with home court, back-to-backs and the injury report (the usual minutes of players listed out, times how much better they are than a bench player). Each game is simulated ${(20000).toLocaleString()} times, overtime included, and every player is simulated inside it.${btTxt()}</p>
    <p class="note">Odds: ${D.odds?.source === "odds_api" ? `The Odds API, ${D.odds.remaining ?? "?"} credits left this month on the NBA key.` : esc(D.odds?.note || "ESPN's DraftKings lines.")}</p>`;
  $("#record").innerHTML = h;
  document.querySelectorAll("[data-del]").forEach(b => b.onclick = () => { BETS = BETS.filter(x => x.id !== b.dataset.del); lsSet(LS_BETS, BETS); renderRecord(); });
}

function btTxt() {
  const B = D.model?.backtest; if (!B) return "";
  const a = (B.spread_ats || [])[0] || {}, t = (B.total_ats || [])[0] || {};
  return ` Walk-forward test on ${B.games?.toLocaleString()} games (${(B.test_seasons || []).map(s => `${s}-${String(s + 1).slice(2)}`).join(", ")}), each day using only earlier games: average miss on the final margin ${n(B.margin_mae?.model, 2)} points vs ${n(B.margin_mae?.market, 2)} for the closing line, and the model's side against the closing spread went ${a.w}-${a.l} (${n(a.pct, 1)}%), totals ${t.w}-${t.l} (${n(t.pct, 1)}%). The closing line is sharper than the model, which is why game plays need Pinnacle's price and the model only has to agree. Props were checked the same way: the model's chances at the fair line land within about 2 to 3 points of real results for every stat.`;
}
/* ---------- boot ---------- */
document.addEventListener("click", e => {
  const go = e.target.closest("[data-go]"); if (go) { showTab(go.dataset.go); return; }
  const gm = e.target.closest("[data-game]");
  if (gm) { showTab("games"); setTimeout(() => { const d = document.getElementById("g-" + gm.dataset.game); if (d) { d.open = true; d.scrollIntoView({block: "start"}); d.classList.add("flash"); } }, 60); }
});
function render() { renderHome(); renderGames(); renderProps(); renderParlays(); renderTeams(); renderRecord(); }
function fresh() {
  const mins = Math.round((Date.now() - new Date(D.generated_at)) / 60000);
  const txt = mins < 60 ? `Updated ${mins} min ago` : mins < 1440 ? `Updated ${Math.round(mins / 60)} h ago` : `Updated ${Math.round(mins / 1440)} d ago`;
  $("#freshTxt").textContent = txt; $("#freshTxtM").textContent = txt.replace("Updated ", "");
  [$("#fresh"), $("#freshM")].forEach(f => f.classList.toggle("stale", mins > 26 * 60));
}
Promise.all([fetch("data/latest.json", {cache: "no-store"}).then(r => r.json()), fetch("data/results.json", {cache: "no-store"}).then(r => r.ok ? r.json() : {}).catch(() => ({}))])
  .then(([d, res]) => { D = d; RES = res; $("#sub").textContent = `${d.season}–${String(d.season + 1).slice(2)} season`; fresh(); render(); })
  .catch(e => { $("#home").innerHTML = `<div class="empty"><b>Couldn't load the NBA model.</b> ${esc(e.message)}</div>`; });
/* ---- GATES-JS start (tools/altjs.py) ---- */
/* bet-type gates (gates.py): paused types tracked in the background, and game types watched for closing-line value */
const gSgn = (v, d = 1) => v == null || isNaN(v) ? "–" : (v > 0 ? "+" : "") + Number(v).toFixed(d);
const gList = () => D.gates || D.tracking?.gates || [];
const gWatch = x => x.clv_gate && x.status === "active" && !(x.history || []).some(h => h.to === "active");
function gateCard(x) {
  const R = x.record || {}, back = x.status === "active", watch = gWatch(x);
  const pct = watch ? Math.min(100, 100 * (R.ev_n || 0) / (x.clv_pause_n || 30)) : Math.min(100, 100 * (R.n || 0) / x.min_n);
  const evTxt = R.ev_n ? `${gSgn(R.ev_close, 1)}% at the closing price over ${R.ev_n} priced` : "no closing prices yet";
  const need = watch ? `Closing-line check: ${evTxt}. Pauses at ${x.clv_pause_n || 30}+ priced plays if that stays below 0%, or if the return reaches ${x.repause_roi}%.`
    : back ? `Back since ${esc(String(x.since).slice(5))}. Paused again if it returns ${x.repause_roi}% or worse over its next ${x.min_n}${x.clv_gate ? ", or loses to the closing line" : ""}.`
    : `${R.n || 0} of ${x.min_n} graded. Needs a +${x.min_roi}% return${x.clv_gate ? " and 0% or better at the closing price" : ""} to come back${R.ev_n ? ` (now ${gSgn(R.ev_close, 1)}%)` : R.clv_n >= 15 ? ` (closing value so far ${gSgn(R.clv, 2)})` : ""}.`;
  const tag = watch ? `<span class="vt thin">On watch</span>` : back ? `<span class="tag">Back in plays</span>` : `<span class="vt">Paused</span>`;
  return `<div class="gate"><div class="gh"><b>${esc(x.label)}</b>${tag}</div>
    ${watch ? "" : `<div class="dim" style="font-size:12.5px">${esc(x.why)}</div>`}
    <div class="gs"><span>${R.n ? `${R.w}–${R.l}` : "0–0"} ${back ? "as plays" : "shadow"}</span><span class="${R.n ? (R.units >= 0 ? "up" : "down") : "dim"}">${R.n ? `${gSgn(R.units, 2)}u, ${gSgn(R.roi)}%` : "no results yet"}</span></div>
    <div class="gbar"><i style="width:${pct}%"></i></div><div style="font-size:13px">${need}</div></div>`;
}
function gatesHTML() {
  const G = gList(); if (!G.length) return "";
  const watch = G.filter(gWatch), rest = G.filter(x => !gWatch(x));
  let h = "";
  if (rest.length) {
    const g0 = rest[0];
    h += `<h3>Paused bets, tracked in the background</h3><p class="sub">When a bet type is cut, the model keeps finding the bets it would have played, locks them at the price it saw, and grades them. Only bets from the pause date on count, so a comeback is earned on fresh results. A type comes back into plays on its own after about ${g0.min_n} graded at a +${g0.min_roi}% return or better, without losing to the closing line.</p>
    <div class="gates">${rest.map(gateCard).join("")}</div>
    <p class="note">Record is shadow plays while paused, real plays once back. Shadow plays are never in your units.</p>`;
  }
  if (watch.length) h += `<h3>Bet types on watch</h3><p class="sub">Each game bet type is checked against the closing line: the return its plays would make if the closing price is the true chance. A type that stays below 0% over 30+ priced plays is paused automatically, even if it has been winning, because wins without closing-line value usually don't last.</p>
    <div class="gates">${watch.map(gateCard).join("")}</div>`;
  return h;
}
function propClvHTML() {
  const C = D.tracking?.prop_clv; if (!C || !C.n) return "";
  return `<p class="note"><b>Prop plays vs the closing line:</b> ${C.n} checked, ${C.beat} moved our way, ${C.worse} moved against` +
    (C.ev_close != null ? `, ${gSgn(C.ev_close, 1)}% return at the closing price (same-line plays)` : "") +
    `. A play is locked when first flagged; the closing line is the book's last line before the game.</p>`;
}
/* scorecard (Oct 30 2026): every bet type in one table, sorted by how it's doing since the current rules */
function scStatus(x) {
  const R = x.record || {};
  if (x.status !== "active") return ["Paused", "sc-off", 3];
  if ((R.n || 0) < x.min_n) return ["Proving", "sc-new", 1];
  const clvBad = R.ev_n >= 15 && R.ev_close < 0;
  if ((R.roi || 0) > 0 && !clvBad) return ["Earning", "sc-ok", 0];
  return ["Struggling", "sc-warn", 2];
}
function scorecardHTML() {
  const G = gList(); if (!G.length) return "";
  const all = G.map(x => ({x, s: scStatus(x)})).sort((a, b) => a.s[2] - b.s[2] || ((b.x.record || {}).units || 0) - ((a.x.record || {}).units || 0));
  const rows = all.filter(r => (r.x.record || {}).n || r.s[0] === "Paused"), idle = all.filter(r => !rows.includes(r));
  const cnt = k => all.filter(r => r.s[0] === k).length;
  return `<div class="dash"><div class="panel span-12"><h3>Scorecard</h3><p class="pmuted">Every bet type under the current rules. <b>Earning</b>: past its sample, winning, not losing to the closing line. <b>Proving</b>: too few results yet, stake small. <b>Struggling</b>: losing money or losing to the close; pauses on its own if it keeps up. <b>Paused</b>: not a play, tracked in the background until it earns its way back.</p>
    <div class="sc-sum"><span class="sc-ok">${cnt("Earning")} earning</span><span class="sc-new">${cnt("Proving")} proving</span><span class="sc-warn">${cnt("Struggling")} struggling</span><span class="sc-off">${cnt("Paused")} paused</span></div>
    ${rows.length ? `<div class="tablewrap"><table class="sc"><thead><tr><th>Bet type</th><th>Record</th><th>Close</th></tr></thead><tbody>
    ${rows.map(({x, s}) => { const R = x.record || {};
      return `<tr><td>${esc(x.label)} <span class="sc-tag ${s[1]}">${s[0]}</span><span class="roi">${x.status === "active" ? "since " : "shadow since "}${esc(String(x.since).slice(5))}, ${R.n || 0} of ${x.min_n} graded</span></td>
        <td>${R.n ? `${R.w}–${R.l}` : "0–0"}<span class="roi ${R.n ? (R.units >= 0 ? "up" : "down") : ""}">${R.n ? `${gSgn(R.units, 1)}u, ${gSgn(R.roi, 0)}%` : ""}</span></td>
        <td>${R.ev_n ? `<span class="${R.ev_close >= 0 ? "up" : "down"}">${gSgn(R.ev_close, 1)}%</span><span class="roi">${R.ev_n} priced</span>` : `<span class="dim">–</span>`}</td></tr>`; }).join("")}
    </tbody></table></div>` : ""}
    ${idle.length ? `<p class="note">No plays yet: ${idle.map(r => esc(r.x.label)).join(", ")}.</p>` : ""}</div></div>`;
}
function gatesNote() {
  const G = gList(), back = G.filter(x => x.status === "active" && !gWatch(x) && x.name !== "nba_edge"), off = G.filter(x => x.clv_gate && x.status === "paused");
  return (back.length ? ` <b>Back in plays:</b> ${back.map(x => esc(x.label)).join(", ")}.` : "") +
         (off.length ? ` <b>Paused:</b> ${off.map(x => esc(x.label)).join(", ")}.` : "");
}
/* ---- GATES-JS end ---- */
