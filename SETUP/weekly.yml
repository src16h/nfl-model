name: Weekly NFL model

on:
  schedule:
    # Two runs a day. Times are UTC: ET is UTC minus 4 until Nov 1, then minus 5
    # (after that, runs land an hour earlier in ET). GitHub can start runs 5 to 30 minutes late.
    - cron: "7 12 * * 1-6"   # Mon to Sat, 8am ET: overnight injury news, grades finished games
    - cron: "7 22 * * 1-6"   # Mon to Sat, 6pm ET: before Thursday and Monday night games
    - cron: "45 15 * * 0"    # Sunday 11:45am ET: after inactives, before 1pm kickoffs
    - cron: "7 23 * * 0"     # Sunday 7pm ET: before the Sunday night game
  workflow_dispatch:        # adds a "Run workflow" button in the Actions tab

permissions:
  contents: write

concurrency:
  group: nfl-model
  cancel-in-progress: false

jobs:
  run-model:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Check project files
        run: |
          missing=""
          for f in run_weekly.py requirements.txt nflmodel/config.py docs/index.html data/overrides.csv; do
            [ -f "$f" ] || missing="$missing $f"
          done
          if [ -n "$missing" ]; then
            echo "::error::Project files not found at the top of the repository. Missing:$missing. Re-upload the items INSIDE the unzipped nfl-model folder (not the folder itself)."
            echo "---- Files GitHub can see ----"
            find . -maxdepth 3 -not -path './.git*' | sort
            exit 1
          fi
          echo "All project files found."

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Run model
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}   # optional: turns on automatic lines
        run: python run_weekly.py

      - name: Save results
        run: |
          git config user.name "nfl-model-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data
          git diff --staged --quiet && exit 0
          git commit -m "Model update $(date -u +'%Y-%m-%d %H:%M')"
          for i in 1 2 3; do
            git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push && exit 0
            sleep 5
          done
          echo "::error::Could not save results after 3 tries"; exit 1
