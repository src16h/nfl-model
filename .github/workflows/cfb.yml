name: College football model

on:
  schedule:
    # Times are UTC: ET is UTC minus 4 until Nov 1, then minus 5 (runs land an hour earlier in ET after that).
    # GitHub can start runs 5 to 30 minutes late.
    - cron: "20 13 * * *"     # every day 9:20am ET: grades finished games, fresh lines
    - cron: "20 21 * * 2-5"   # Tue to Fri 5:20pm ET: before weeknight games
    - cron: "5 15 * * 6"      # Saturday 11:05am ET: before the noon kickoffs
    - cron: "5 19 * * 6"      # Saturday 3:05pm ET: before the afternoon games
    - cron: "35 22 * * 6"     # Saturday 6:35pm ET: before the night games
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cfb-model
  cancel-in-progress: false

jobs:
  run-model:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Run model
        env:
          ODDS_API_KEY_CFB: ${{ secrets.ODDS_API_KEY_CFB }}   # optional: book lines for player props
        run: python run_cfb.py

      - name: Save results
        run: |
          git config user.name "cfb-model-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/cfb/data data/cfb
          git diff --staged --quiet && exit 0
          git commit -m "CFB update $(date -u +'%Y-%m-%d %H:%M')"
          for i in 1 2 3 4; do
            git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push && exit 0
            sleep 7
          done
          echo "::error::Could not save results after 4 tries"; exit 1
