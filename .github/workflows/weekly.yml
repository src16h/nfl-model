name: Weekly NFL model

on:
  schedule:   # UTC times set for Eastern Standard Time (EST, UTC-5) until Mar 14 2027
    # Two runs a day. Times are UTC: ET is UTC minus 4 until Nov 1, then minus 5
    # (after that, runs land an hour earlier in ET). GitHub has started these runs hours late since Nov 1 2026, so the
    # Clock workflow (tools/clock.py) starts each one on time from these same lines; these crons are the backup
    # (the guard job skips a late one the Clock already covered).
    - cron: "7 13 * * 1-6"   # Mon to Sat, 8am ET: overnight injury news, grades finished games
    - cron: "7 23 * * 1-6"   # Mon to Sat, 6pm ET: before Thursday and Monday night games
    - cron: "45 16 * * 0"    # Sunday 11:45am ET: after inactives, before 1pm kickoffs
    - cron: "40 19 * * 0"    # Sunday 2:40pm ET: inactives and near-closing lines for the 4pm games
    - cron: "7 0 * * 1"     # Sunday 7pm ET: before the Sunday night game
  workflow_dispatch:        # adds a "Run workflow" button in the Actions tab

permissions:
  contents: write
  actions: read             # lets the guard job see recent runs

concurrency:
  group: nfl-model
  cancel-in-progress: false

jobs:
  guard:                    # a late scheduled run skips itself when the Clock (or a person) already started this
                            # workflow in the last 6 hours, or any run finished in the last hour (Nov 10 2026)
    runs-on: ubuntu-24.04
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then echo "skip=0" >> "$GITHUB_OUTPUT"; exit 0; fi
          recent=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/weekly.yml/runs?per_page=30" --jq '[.workflow_runs[]
                 | select(.id != ${{ github.run_id }})
                 | select((.event == "workflow_dispatch" and (now - (.created_at | fromdateiso8601)) < 21600)
                          or ((.conclusion == "success" or .status != "completed") and (now - (.created_at | fromdateiso8601)) < 3600))]
                 | length' || echo 0)
          echo "Recent runs that cover this slot: $recent"
          if [ "${recent:-0}" -gt 0 ]; then echo "skip=1" >> "$GITHUB_OUTPUT"; else echo "skip=0" >> "$GITHUB_OUTPUT"; fi

  run-model:
    needs: guard
    if: needs.guard.outputs.skip != '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Check project files
        run: |
          missing=""
          for f in run_weekly.py requirements.txt nflmodel/config.py docs/index.html data/overrides.csv; do
            [ -f "$f" ] || missing="$missing $f"
          done
          if [ -n "$missing" ]; then
            echo "::error::Project files not found at the top of the repository. Missing:$missing. Re-upload the items INSIDE the unzipped nfl-model folder (not the folder itself)."
            echo "---- Files GitHub can see ----"
            find . -maxdepth 3 -not -path './.git*' | sort
            exit 1
          fi
          echo "All project files found."

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Run model
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}   # optional: turns on automatic lines
        run: python run_weekly.py

      - name: Save results
        run: |
          git config user.name "nfl-model-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data
          git diff --staged --quiet && exit 0
          git commit -m "Model update $(date -u +'%Y-%m-%d %H:%M')"
          for i in 1 2 3; do
            git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push && exit 0
            sleep 5
          done
          echo "::error::Could not save results after 3 tries"; exit 1
