name: Daily NBA model

on:
  schedule:   # UTC times set for Eastern Standard Time (EST, UTC-5) until Mar 14 2027
    # Times are UTC. Shift every cron one hour earlier when daylight time starts (Mar 14 2027).
    - cron: "22 16 * * *"   # 11:22am ET: grades last night, morning lines and injuries
    - cron: "22 22 * * *"   # 5:22pm ET: fresh lines, player props and alt lines before 7pm tips
    - cron: "45 23 * * *"   # 6:45pm ET: near-closing lines (CLV) and late injury news
    - cron: "40 1 * * *"    # 8:40pm ET: late injury news before the 10pm West Coast tips
  workflow_dispatch:

permissions:
  contents: write
  actions: read             # guard job: sees recent runs

concurrency:
  group: nba-model
  cancel-in-progress: false

jobs:
  guard:                    # a late scheduled run skips itself when the Clock (or a person) already started this
                            # workflow in the last 6 hours, or any run finished in the last hour (Nov 10 2026)
    runs-on: ubuntu-24.04
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then echo "skip=0" >> "$GITHUB_OUTPUT"; exit 0; fi
          recent=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/nba.yml/runs?per_page=30" --jq '[.workflow_runs[]
                 | select(.id != ${{ github.run_id }})
                 | select((.event == "workflow_dispatch" and (now - (.created_at | fromdateiso8601)) < 21600)
                          or ((.conclusion == "success" or .status != "completed") and (now - (.created_at | fromdateiso8601)) < 3600))]
                 | length' || echo 0)
          echo "Recent runs that cover this slot: $recent"
          if [ "${recent:-0}" -gt 0 ]; then echo "skip=1" >> "$GITHUB_OUTPUT"; else echo "skip=0" >> "$GITHUB_OUTPUT"; fi

  run-model:
    needs: guard
    if: needs.guard.outputs.skip != '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Run model
        env:
          ODDS_API_KEY_NBA: ${{ secrets.ODDS_API_KEY_NBA }}   # optional: Pinnacle referee price, props and alt lines
        run: python run_nba.py

      - name: Save results
        run: |
          git config user.name "nba-model-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/nba/data data/nba
          git diff --staged --quiet && exit 0
          git commit -m "NBA update $(date -u +'%Y-%m-%d %H:%M')"
          for i in 1 2 3 4; do
            git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push && exit 0
            sleep 7
          done
          echo "::error::Could not save results after 4 tries"; exit 1
