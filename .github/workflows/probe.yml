name: Odds market check

# Manual only: lists which markets each book posts for the next 2 NFL, NHL and Premier League events.
# About 2 credits per sport.
on:
  workflow_dispatch:
    inputs:
      probe:
        description: "markets (default), kalshi, nbaalt, nhlsog, nbamain, nhlmain, nflalt or nflyds (Hard Rock main line vs lowest alt rung, and which sides each alt ladder posts)"
        default: markets

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Check markets
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          ODDS_API_KEY_NHL: ${{ secrets.ODDS_API_KEY_NHL }}
          ODDS_API_KEY_SOCCER: ${{ secrets.ODDS_API_KEY_SOCCER }}
          ODDS_API_KEY_NBA: ${{ secrets.ODDS_API_KEY_NBA }}
          ODDS_API_KEY_CFB: ${{ secrets.ODDS_API_KEY_CFB }}
          PROBE: ${{ inputs.probe }}
        run: |
          if [ "$PROBE" = "kalshi" ]; then python tools/probe_kalshi.py; elif [ "$PROBE" = "nbaalt" ]; then python tools/probe_nba_alts.py; elif [ "$PROBE" = "nbamain" ]; then PROBE_EVENTS=2 PROBE_MAIN=player_points,player_rebounds,player_assists,player_threes python tools/probe_nba_alts.py; elif [ "$PROBE" = "nhlmain" ]; then PROBE_SPORT=icehockey_nhl PROBE_MARKETS=player_shots_alternate,player_points PROBE_EVENTS=1 PROBE_MAIN=player_shots_on_goal python tools/probe_nba_alts.py; elif [ "$PROBE" = "nflalt" ]; then PROBE_SPORT=americanfootball_nfl PROBE_MARKETS=player_receptions_alternate,player_pass_completions_alternate,player_pass_attempts_alternate,player_rush_attempts_alternate PROBE_EVENTS=1 PROBE_MAIN=player_receptions,player_pass_completions,player_pass_attempts python tools/probe_nba_alts.py; elif [ "$PROBE" = "nflyds" ]; then PROBE_SPORT=americanfootball_nfl PROBE_MARKETS=player_pass_yds_alternate,player_rush_yds_alternate,player_reception_yds_alternate PROBE_EVENTS=1 PROBE_MAIN=player_pass_yds,player_rush_yds,player_reception_yds PROBE_ALL=1 python tools/probe_nba_alts.py; elif [ "$PROBE" = "nhlsog" ]; then PROBE_SPORT=icehockey_nhl PROBE_MARKETS=player_shots_on_goal_alternate,player_points_alternate PROBE_EVENTS=1 python tools/probe_nba_alts.py; else python tools/probe_markets.py 2; fi
