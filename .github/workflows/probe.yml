name: Odds market check

# Manual only: lists which markets each book posts for the next 2 NFL, NHL and Premier League events.
# About 2 credits per sport.
on:
  workflow_dispatch:
    inputs:
      probe:
        description: "markets (default), kalshi or nbaalt"
        default: markets

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Check markets
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          ODDS_API_KEY_NHL: ${{ secrets.ODDS_API_KEY_NHL }}
          ODDS_API_KEY_SOCCER: ${{ secrets.ODDS_API_KEY_SOCCER }}
          ODDS_API_KEY_NBA: ${{ secrets.ODDS_API_KEY_NBA }}
          ODDS_API_KEY_CFB: ${{ secrets.ODDS_API_KEY_CFB }}
          PROBE: ${{ inputs.probe }}
        run: |
          if [ "$PROBE" = "kalshi" ]; then python tools/probe_kalshi.py; elif [ "$PROBE" = "nbaalt" ]; then python tools/probe_nba_alts.py; else python tools/probe_markets.py 2; fi
