name: Weekly review scorecard

# Rebuilds docs/review/latest.md from every sport's published data (tools/weekly_review.py), no odds credits.
# Runs early Tuesday before the weekly review session reads it; can also be run by hand.
on:
  schedule:
    - cron: "17 10 * * 2"   # Tuesday about 5:17am ET (6:17am in daylight time)
  workflow_dispatch:

permissions:
  contents: write
  actions: read          # records_check.py: how late each scheduled run fired

jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build scorecard
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python tools/weekly_review.py
      - name: Save
        run: |
          git config user.name "review-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/review
          git diff --staged --quiet && exit 0
          git commit -m "Weekly review scorecard $(date -u +'%Y-%m-%d')"
          for i in 1 2 3 4; do git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push && exit 0; sleep 7; done
          exit 1
