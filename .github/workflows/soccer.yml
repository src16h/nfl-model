name: Soccer model

on:
  schedule:
    # Times are UTC. ET is UTC minus 4 until Nov 1, then minus 5 (runs land an hour earlier in ET after that).
    # Each run before kickoff picks up confirmed lineups (posted about an hour before) and near-closing prices for CLV.
    - cron: "40 13 * * *"       # daily 9:40am ET: grades yesterday, fresh lines and props
    - cron: "40 17 * * 2,3"     # Tue/Wed 1:40pm ET: before 7:45pm UK midweek kickoffs (lineups out)
    - cron: "50 17 * * 5"       # Fri 1:50pm ET: before Friday night games in England and Spain
    - cron: "45 10 * * 6"       # Sat 6:45am ET: before the 12:30pm UK early game
    - cron: "15 13 * * 6"       # Sat 9:15am ET: lineups for the 3pm UK games (Premier League, Championship)
    - cron: "45 15 * * 6"       # Sat 11:45am ET: lineups for 5:30pm UK and La Liga afternoon
    - cron: "15 18 * * 6"       # Sat 2:15pm ET: La Liga evening
    - cron: "15 12 * * 0"       # Sun 8:15am ET: lineups for the 2pm UK games
    - cron: "45 14 * * 0"       # Sun 10:45am ET: 4:30pm UK and La Liga afternoon
    - cron: "15 18 * * 0"       # Sun 2:15pm ET: La Liga evening
    - cron: "15 18 * * 1"       # Mon 2:15pm ET: Monday night games
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: soccer-model
  cancel-in-progress: false

jobs:
  run-model:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Run model
        env:
          ODDS_API_KEY_SOCCER: ${{ secrets.ODDS_API_KEY_SOCCER }}   # optional: book lines for 1X2, handicaps and totals
        run: python run_soccer.py

      - name: Save results
        run: |
          git config user.name "soccer-model-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/soccer/data data/soccer
          git diff --staged --quiet && exit 0
          git commit -m "Soccer update $(date -u +'%Y-%m-%d %H:%M')"
          for i in 1 2 3 4; do
            git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push && exit 0
            sleep 7
          done
          echo "::error::Could not save results after 4 tries"; exit 1
