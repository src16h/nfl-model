name: Soccer model

on:
  schedule:
    # Times are UTC, set for UK winter time (GMT = UTC) and Spain (CET = UTC+1), Oct 25 2026 to Mar 28 2027.
    # Move every line 1 hour earlier when the UK and Spain go back to summer time (Mar 28 2027).
    # Pre-kickoff runs land about 45 to 55 minutes before kickoff, after the lineups are posted.
    - cron: "40 13 * * *"       # daily: grades yesterday, fresh lines and props
    - cron: "55 18 * * 2,3"     # Tue/Wed: before 7:45pm UK midweek kickoffs (19:45 UTC)
    - cron: "20 19 * * 2,3"     # Tue/Wed: before 9pm Spain midweek kickoffs (20:00 UTC)
    - cron: "10 19 * * 5"       # Fri: before Friday night games in England (20:00) and Spain (21:00 CET)
    - cron: "45 11 * * 6"       # Sat: before the 12:30pm UK early game
    - cron: "15 14 * * 6"       # Sat: lineups for the 3pm UK games (Premier League, Championship)
    - cron: "45 16 * * 6"       # Sat: 5:30pm UK and La Liga late afternoon
    - cron: "15 19 * * 6"       # Sat: La Liga 9pm CET
    - cron: "15 13 * * 0"       # Sun: lineups for the 2pm UK games
    - cron: "45 15 * * 0"       # Sun: 4:30pm UK and La Liga afternoon
    - cron: "15 19 * * 0"       # Sun: La Liga 9pm CET
    - cron: "15 19 * * 1"       # Mon: Monday night games (8pm UK / 9pm Spain)
  workflow_dispatch:

permissions:
  contents: write
  actions: read             # guard job: sees recent runs

concurrency:
  group: soccer-model
  cancel-in-progress: false

jobs:
  guard:                    # a late scheduled run skips itself when the Clock (or a person) already started this
                            # workflow in the last 6 hours, or any run finished in the last hour (Nov 10 2026)
    runs-on: ubuntu-24.04
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then echo "skip=0" >> "$GITHUB_OUTPUT"; exit 0; fi
          recent=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/soccer.yml/runs?per_page=30" --jq '[.workflow_runs[]
                 | select(.id != ${{ github.run_id }})
                 | select((.event == "workflow_dispatch" and (now - (.created_at | fromdateiso8601)) < 21600)
                          or ((.conclusion == "success" or .status != "completed") and (now - (.created_at | fromdateiso8601)) < 3600))]
                 | length' || echo 0)
          echo "Recent runs that cover this slot: $recent"
          if [ "${recent:-0}" -gt 0 ]; then echo "skip=1" >> "$GITHUB_OUTPUT"; else echo "skip=0" >> "$GITHUB_OUTPUT"; fi

  run-model:
    needs: guard
    if: needs.guard.outputs.skip != '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Run model
        env:
          ODDS_API_KEY_SOCCER: ${{ secrets.ODDS_API_KEY_SOCCER }}   # optional: book lines for 1X2, handicaps and totals
        run: python run_soccer.py

      - name: Save results
        run: |
          git config user.name "soccer-model-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/soccer/data data/soccer
          git diff --staged --quiet && exit 0
          git commit -m "Soccer update $(date -u +'%Y-%m-%d %H:%M')"
          for i in 1 2 3 4; do
            git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push && exit 0
            sleep 7
          done
          echo "::error::Could not save results after 4 tries"; exit 1
